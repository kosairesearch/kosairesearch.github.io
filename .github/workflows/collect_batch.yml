name: 📦 리포트 배치 회수 (남은 주문 받아오기)

# 리포트를 한꺼번에 주문(배치)해 놓고 결과를 받아오는 일만 한다.
#
# 왜 따로 떼어냈나. 전에는 주문한 잡이 그 자리에서 결과를 기다렸다. 그런데
# 배치는 24시간까지 걸릴 수 있고 잡은 6시간에 잘린다. 8월 20일 새벽 479건이
# 그렇게 날아갔다 — 돈은 이미 나갔고 리포트는 하나도 안 들어왔다. 며칠 전
# 같은 일이 또 있었다.
#
# 주문과 회수를 나누면 6시간 제한이 의미가 없어진다. 주문하는 쪽은 넣고
# 바로 끝내고, 이 워크플로가 30분마다 와서 "끝났나" 보고 끝났으면 받아간다.
#
# 회수는 이미 결제된 결과를 받아오는 것이라 추가 과금이 없다.
on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kos-collect-batch
  cancel-in-progress: false

jobs:
  pickup:
    runs-on: ubuntu-latest
    # 회수만 하므로 오래 걸릴 일이 없다. 정량 재수집도 하지 않는다.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 받아올 게 없으면 파이썬도 띄우지 않는다 — 30분마다 도는 잡이라
      # 빈손으로 도는 비용을 최대한 줄인다.
      - name: 받아올 배치가 있나
        id: gate
        run: |
          if [ -f data/reports_paused ]; then
            echo "⏸️  과금 정지 중 — 회수도 하지 않는다"
            echo "go=false" >> $GITHUB_OUTPUT; exit 0
          fi
          python - <<'PY' >> $GITHUB_OUTPUT
          import json, pathlib
          f = pathlib.Path("data/batch_state_v2.json")
          s = json.loads(f.read_text(encoding="utf-8")) if f.exists() else {}
          need = bool(s.get("batch_id")) and not s.get("collected") and not s.get("abandoned")
          print(f"go={'true' if need else 'false'}")
          PY
          cat $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: '3.11'
      - if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: 회수
        if: steps.gate.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_reports_v2.py pickup 2>&1 | tee -a data/reports_v2_run.log

      - name: 커밋 · 배포
        if: steps.gate.outputs.go == 'true'
        run: |
          git config user.name  "KOS ai Bot"
          git config user.email "bot@kosairesearch.github.io"
          git add data/reports_v2 data/batch_state_v2.json
          git reset -q data/reports_v2/index.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "받아온 것 없음 — 커밋하지 않는다"; exit 0
          fi
          git commit -q -m "📦 리포트 배치 회수 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
          for i in $(seq 1 10); do
            git fetch origin main -q 2>/dev/null || true
            if git rebase origin/main 2>/dev/null && git push origin main 2>/dev/null; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 9) + 2 ))
          done
          echo "::error::회수분 푸시 실패"; exit 1
