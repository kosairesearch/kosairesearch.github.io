name: 🆕 상장 전 신규 상장 리포트

# 신규 상장 종목의 리포트를 상장 전에 쓰고 게시한다(2026-11-18 사장 "상장 당일에 리포트를 뿌려야 유입이 많이 되는데, 당일에 일찍 리포트를
# 만들 수 없어?"). 한국거래소가 상장 이틀(영업일) 전 오후에 KIND 에 올리는 '신규상장' 안내로 종목코드를 미리 알아(scripts/ipo_reports.py),
# 옛 형식 생성기(배치 · 하이쿠)로 쓰고, 종목 페이지(한국어 · 영어)를 만들어 올린 뒤 네이버에 새 주소를 한 번 알린다.
#
# 언제 도나 — 깃허브 예약은 몇 시간씩 밀린다(신규 상장 작업의 23:30 예약이 이튿날 05:56~08:29 에 돌았다). 그래서 정해진 시각에 깨우는 것은
# 모닝 브리핑 작업이다 — 파이어베이스 예약이 06:40 · 07:15 에 브리핑을 깨우고, 브리핑이 개장일이면 맨 앞에서 이 작업을 부른다. 아래 예약은
# 안내가 나온 날 저녁에 먼저 쓰려는 덤이다(밀려도 아침 브리핑이 다시 부른다). 몇 번 불려도 같다 — 리포트가 있는 종목은 다시 쓰지 않는다.
#
# 공용 실행 순서(kos-data)에 넣지 않는다 — 실적 철 공시 트리거(4~5시간)에 밀려 기다리다 뒤에 온 실행에 취소되면 상장일을 놓친다.
# 올리는 파일은 이 작업이 쓴 것만 고른다(같이 도는 작업과 겹치지 않게) · 충돌은 scripts/push_main.sh 가 푼다.
on:
  schedule:
    - cron: '17 9 * * 1-5'     # 18:17 KST — 안내(오후 5~6시)가 나온 뒤
    - cron: '43 12 * * 1-5'    # 21:43 KST — 덤
  workflow_dispatch:

concurrency:
  group: kos-ipo
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # 워치독 정리 요청(맨 끝 단계)

jobs:
  ipo:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # 큐에서 기다린 실행도 앞 실행이 올린 리포트를 보게 main 을 받는다(모닝 브리핑과 같은 까닭)
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 1) 상장 예정 종목 찾기(KIND '신규상장' 안내 · 공모진행 현황)
        id: prep
        run: |
          python scripts/ipo_reports.py prepare 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          # 지난 실행이 시간 안에 받지 못한 배치가 있으면 그것부터 받는다(생성기가 먼저 회수한다)
          if python -c "import json,sys; s=json.load(open('data/ipo_batch_state.json')); sys.exit(0 if s.get('pending') else 1)" 2>/dev/null; then
            echo "pending=1" >> $GITHUB_OUTPUT
          fi

      - name: 2) 리포트 작성(배치 · 하이쿠 5.5)
        if: steps.prep.outputs.has_new == '1' || steps.prep.outputs.pending == '1'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          REPORT_TICKERS: ${{ steps.prep.outputs.tickers }}
          REPORT_EXTRA_STOCKS: ipo                       # 시세 자료에 없는 상장 예정 종목(data/ipo.json)
          BATCH_STATE_FILE: data/ipo_batch_state.json    # 신규 상장 작업 · 공시 트리거와 상태 파일을 나누지 않으면 서로 막힌다
          BATCH_MAX_WAIT_SEC: '3000'                     # 50분 — 못 받으면 다음 실행이 먼저 받는다
          REPORT_MODEL: 'claude-haiku-5-5'               # 2026-11-08 사장 "모든 종목 리포트를 … 다 하이쿠로 · 무조건 batch api"
        run: |
          if [ -n "$REPORT_TICKERS" ]; then
            python scripts/generate_reports_batch.py auto 2>&1 | tee -a data/reports_run.log
          else
            python scripts/generate_reports_batch.py collect 2>&1 | tee -a data/reports_run.log
          fi

      - name: 3) 종목 페이지 · 사이트맵
        id: pages
        run: |
          python scripts/ipo_reports.py published
          tks=$(python -c "import sys; sys.path.insert(0,'scripts'); import ipo_listings as L; from pathlib import Path; print(' '.join(sorted(t for t in L.active() if Path(f'data/reports/{t}.json').exists() or Path(f'data/reports_v2/{t}.json').exists())))")
          echo "tickers=$tks" >> $GITHUB_OUTPUT
          if [ -n "$tks" ]; then
            python scripts/build_stock_static.py $tks || echo "::warning::종목 페이지를 만들지 못했다 — 리포트 워치독이 다시 만든다"
          fi
          python scripts/generate_sitemap.py || true

      - name: 4) 커밋 · 올리기
        env:
          TKS: ${{ steps.pages.outputs.tickers }}
        run: |
          git config --global user.email "bot@kosairesearch.github.io"
          git config --global user.name "KOS ai Bot"
          git add data/ipo.json data/reports-index.js sitemap.xml stock/assets/ 2>/dev/null || true
          for f in data/ipo_batch_state.json data/new_listing_fail.json; do [ -e "$f" ] && git add "$f"; done
          for t in $TKS; do
            for f in "data/reports/$t.json" "stock/$t.html" "en/stock/$t.html"; do [ -e "$f" ] && git add "$f"; done
          done
          git commit -m "🆕 상장 전 신규 상장 리포트 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')" || { echo "변경 없음"; exit 0; }
          bash scripts/push_main.sh

      # 배포가 끝나 페이지가 열리면 새 주소(한국어 · 영어)를 네이버에 종목마다 한 번 알린다(IndexNow). 알린 시각을 data/ipo.json 에 적는다.
      - name: 5) 네이버에 새 주소 알리기
        if: steps.pages.outputs.tickers != ''
        continue-on-error: true
        run: |
          python scripts/ipo_reports.py ping
          git add data/ipo.json
          git commit -m "🆕 상장 전 리포트 — 네이버 수집 요청 기록" || exit 0
          bash scripts/push_main.sh

      # 리포트 목록 · 첫 화면 숫자는 워치독이 맞춘다. 브리핑이 GITHUB_TOKEN 으로 부른 실행(실행 주체 github-actions[bot])은 끝나도
      # workflow_run 이 생기지 않아 워치독이 따라 돌지 않는다 — 리포트를 썼으면 직접 부른다(신규 상장 작업과 같은 방식).
      - name: 리포트 목록 정리 요청(워치독 · 정리만)
        if: ${{ always() && github.actor == 'github-actions[bot]' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.sha }}
        run: |
          if git diff --name-only "$BEFORE" HEAD -- data/reports data/reports_v2 | grep -q .; then
            gh workflow run reports_watchdog.yml -f sync_only=true \
              || echo "::warning::워치독 정리 요청 실패 — 예약 실행이 맞춘다"
          else
            echo "새로 쓴 리포트 없음 — 정리 요청 안 함"
          fi
