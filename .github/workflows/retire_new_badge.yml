name: 🏷️ new 배지 떼기 (첫 발행 7일 뒤 · 자동 · 1회성)

# 헤더 '모닝브리핑' 옆의 new 배지를 첫 발행 7일 뒤에 뗀다.
#
# 배지는 수명이 있는 표시다. 한 달 뒤에도 'new' 가 붙어 있으면 오히려 관리가
# 안 되는 사이트로 보인다. 그런데 날짜를 기억했다가 떼는 건 사람이 잘 못 하는
# 종류의 일이라 여기로 옮겼다.
#
# 제거일은 하드코딩하지 않는다. 스크립트가 data/briefs 에서 실제로 발행된
# 첫 브리핑(meta.publishedAt 이 있는 가장 이른 것)을 찾아 7일을 더한다.
# 첫 발행이 2026-08-18 이므로 2026-08-25 에 떨어진다.
#
# 일을 마치면 이 워크플로가 스스로를 지운다. 한 번 쓰고 없어질 것이 매일
# 도는 목록에 남아 있으면 나중에 보는 사람이 "이건 왜 있지" 하고 헤맨다.
on:
  schedule:
    - cron: '0 22 * * *'   # 매일 07:00 KST — 때가 안 됐으면 아무것도 안 한다
  workflow_dispatch:
    inputs:
      force:
        description: '날짜와 무관하게 지금 뗀다'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: retire-new-badge
  cancel-in-progress: false

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 배지 떼기 (때가 됐을 때만)
        id: retire
        run: |
          python scripts/retire_new_badge.py ${{ inputs.force && '--force' || '' }}
          if git diff --quiet -- '*.html'; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "아직 때가 아니거나 이미 뗐다 — 커밋하지 않는다"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 커밋 · 자기 자신 삭제
        if: steps.retire.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 배지를 뗐으면 이 워크플로가 할 일은 끝났다. 같은 커밋에서 스스로를
          # 지운다 — 안 그러면 아무것도 안 하는 잡이 매일 아침 돈다.
          git rm -q .github/workflows/retire_new_badge.yml
          git rm -q scripts/retire_new_badge.py
          git add -A '*.html'
          # 커밋 메시지는 파일로 넘긴다. run: | 블록 안에서는 모든 줄이
          # 들여쓰기를 지켜야 하는데, 여러 줄 메시지를 -m 에 직접 넣으면
          # 그 규칙이 깨져 YAML 이 파싱되지 않는다.
          cat > /tmp/msg.txt <<'MSG'
          🏷️ 헤더 new 배지 제거 (첫 발행 7일 경과)

          모닝브리핑 메뉴에 붙였던 new 배지를 뗀다. 배지 마크업과 CSS 를 함께
          지워 붙이기 직전 상태로 돌아간다.

          이 일을 하던 워크플로와 스크립트도 같이 지운다 — 한 번 쓰고 없어질
          것이 매일 도는 목록에 남아 있으면 나중에 보는 사람이 헤맨다.
          MSG
          sed -i 's/^          //' /tmp/msg.txt
          git commit -q -F /tmp/msg.txt
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "재시도 $i"; sleep $((i*4))
          done
          echo "✅ new 배지 제거 완료 · 워크플로도 함께 삭제" >> $GITHUB_STEP_SUMMARY
