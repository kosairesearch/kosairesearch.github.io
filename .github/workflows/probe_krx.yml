name: KRX 밸류에이션 커버리지 검증 (일회성)

on:
  workflow_dispatch:

concurrency:
  group: kos-probe-names
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 프로브 실행 (결과를 파일로)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          # pykrx 는 한국거래소에 로그인할 때 아이디를 찍는다 — 저장소에 남는 기록에서는 가린다(2026-10-08).
          python scripts/probe_krx_names.py 2>&1 | sed -u 's/\(로그인 ID: \).*/\1(가림)/' || true
