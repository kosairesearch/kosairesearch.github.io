name: 🚀 Firebase 배포 (함수 · Firestore 규칙)

# 터미널 없이 GitHub에서 배포. 수동 실행(원할 때만).
#
# 규칙(firestore.rules)도 여기서 배포한다. 전에는 함수만 배포해서 저장소의
# 규칙과 실제 규칙이 갈라졌다 — users 컬렉션을 열어 주는 규칙을 커밋했는데
# 실사이트에서는 계속 거부됐고, 동의 기록이 조용히 저장되지 않았다.
on:
  workflow_dispatch:

permissions:
  contents: write

# 비밀값 옛 버전 정리(secret_prune.yml)와 겹쳐 돌지 않는다 — 배포 중에 정리가 돌면 함수가 가리키는 버전을 잘못 읽을 수 있다.
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 함수 의존성 설치
        run: cd functions && npm install

      - name: firebase-tools 설치
        run: npm install -g firebase-tools

      - name: 서비스 계정 인증
        env:
          SA: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$SA" > "$HOME/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/sa.json" >> "$GITHUB_ENV"
          gcloud auth activate-service-account --key-file="$HOME/sa.json" --quiet > /dev/null 2>&1

      # 비밀값은 값이 바뀐 때만 새 버전을 만든다(2026-11-05).
      #
      # 전에는 배포할 때마다 같은 값으로 아래 셋에 새 버전을 만들었고, 옛 버전은 지워지지 않았다. Secret Manager 는
      # 켜짐 · 꺼짐 버전마다 달마다 0.06달러(80.6원)를 받는다(결제 계정마다 6개 무료). 10월 29일에 139개가 되어 9월부터
      # 달마다 8,500 ~ 10,700원이 이 항목에서 나갔다. 지금 값(latest)과 같으면 건너뛴다 — 값은 변수에만 담고 찍지 않는다.
      # 옛 버전은 배포가 끝난 뒤 '비밀값 옛 버전 정리' 단계가 지운다(scripts/secret_versions.py).

      - name: RESEND_API_KEY 시크릿 등록
        env:
          RK: ${{ secrets.RESEND_API_KEY }}
        run: |
          cur=$(gcloud secrets versions access latest --secret=RESEND_API_KEY --project kosai-ae167 2>/dev/null || true)
          if [ -n "$cur" ] && [ "$cur" = "$RK" ]; then
            echo "RESEND_API_KEY — 값이 같아 새 버전을 만들지 않습니다"
          else
            printf '%s' "$RK" | firebase functions:secrets:set RESEND_API_KEY \
              --data-file=- --project kosai-ae167 --force
          fi

      # 카카오 어드민 키 — 탈퇴할 때 카카오 앱 연결을 끊는 데 쓴다.
      #
      # 아직 등록하지 않았어도 배포는 되어야 한다. 코드가 선언한 시크릿에
      # 값이 없으면 배포가 통째로 막히기 때문이다(TOSS_SECRET_KEY 로 겪었다).
      # 값이 없으면 자리만 '미설정' 으로 채워 두고, 함수는 그 값을 알아보고
      # 연결 끊기를 건너뛴다 — 탈퇴 자체는 정상으로 돌아간다.
      - name: KAKAO_ADMIN_KEY 시크릿 등록
        env:
          AK: ${{ secrets.KAKAO_ADMIN_KEY }}
        run: |
          if [ -n "$AK" ]; then val="$AK"; else val="미설정"; fi
          cur=$(gcloud secrets versions access latest --secret=KAKAO_ADMIN_KEY --project kosai-ae167 2>/dev/null || true)
          if [ -n "$cur" ] && [ "$cur" = "$val" ]; then
            echo "KAKAO_ADMIN_KEY — 값이 같아 새 버전을 만들지 않습니다"
          else
            printf '%s' "$val" | firebase functions:secrets:set KAKAO_ADMIN_KEY \
              --data-file=- --project kosai-ae167 --force
          fi

      # 모닝 브리핑을 제시각에 깨우는 데 쓰는 GitHub 토큰.
      # 이 저장소의 Actions 에만 쓰기 권한이 있는 fine-grained 토큰이어야 한다.
      # 없으면 자리만 채운다 — 위와 같은 이유다.
      - name: GH_DISPATCH_TOKEN 시크릿 등록
        env:
          GT: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          if [ -n "$GT" ]; then val="$GT"; else val="미설정"; fi
          cur=$(gcloud secrets versions access latest --secret=GH_DISPATCH_TOKEN --project kosai-ae167 2>/dev/null || true)
          if [ -n "$cur" ] && [ "$cur" = "$val" ]; then
            echo "GH_DISPATCH_TOKEN — 값이 같아 새 버전을 만들지 않습니다"
          else
            printf '%s' "$val" | firebase functions:secrets:set GH_DISPATCH_TOKEN \
              --data-file=- --project kosai-ae167 --force
          fi

      # 규칙을 먼저, 따로 올린다.
      #
      # 처음에는 functions,firestore:rules 를 한 명령에 묶었는데 함수 쪽이
      # 깨져 있어서(functions/index.js 의 TOSS_SECRET_KEY 초기화 순서 오류)
      # 규칙까지 같이 못 올라갔다. 규칙은 함수와 아무 상관이 없다 — 한쪽이
      # 고장 났다고 다른 쪽을 막을 이유가 없다.
      - name: Firestore 규칙 배포
        run: |
          set -o pipefail
          firebase deploy --only firestore:rules \
            --project kosai-ae167 --non-interactive --force 2>&1 | tee /tmp/deploy.log

      # 결제 함수는 올리지 않는다.
      #
      # 코드는 저장소에 있지만 결제 기능은 아직 서비스에 넣지 않기로 했다.
      # 그런데 renewSubscriptions 는 onSchedule 이라 올리는 순간 매일 새벽
      # 2시에 혼자 돌면서 만료된 구독의 카드에 결제를 건다. 부르는 화면이
      # 없어도 스스로 도는 함수라, 안 올리는 것이 유일하게 확실한 방법이다.
      #
      # 목록에 없는 함수는 올라가지 않는다. reviewAdminAccessLogs(매월 1일
      # 접속기록 점검 메일)는 9월 6일에 만들고 여기 넣는 것을 빠뜨려 아흐레
      # 동안 올라가지 않았다. unsubscribeMarketing(메일 수신거부 처리)도 10월 29일
      # 첫 배포에서 빠졌다. 새 함수를 만들면 여기까지가 한 일이다 —
      # functions/tests/runtime.test.mjs ③ 이 함수 파일의 내보내기와 이 목록을 견준다.
      #
      # 그래서 올릴 함수를 하나씩 적는다. 결제를 실제로 넣을 때 아래 목록에
      # confirmBilling·changePlan·cancelSubscription·resumeSubscription·
      # requestRefund·renewSubscriptions 를 더하면 된다.
      - name: 함수 배포 (결제 제외)
        run: |
          set -o pipefail
          firebase deploy --project kosai-ae167 --non-interactive --force \
            --only functions:socialLogin,functions:sendVerifyEmail,functions:sendResetEmail,functions:submitForm,functions:getReport,functions:deleteAccount,functions:getUsage,functions:recordSignupConsent,functions:setMarketingConsent,functions:purgeUnconsented,functions:signinHint,functions:adminConsentStats,functions:adminConsentLookup,functions:adminMarketingList,functions:adminUserList,functions:adminNotifyUnconsented,functions:wakeMorningBrief,functions:wakeMorningBriefBackup,functions:watchMorningBrief,functions:adminWakeBrief,functions:adminPurgeOrphans,functions:marketingRecheck,functions:adminMarketingRecheck,functions:reviewAdminAccessLogs,functions:unsubscribeMarketing \
            2>&1 | tee -a /tmp/deploy.log

      # 올라간 함수가 실제로 요청을 받는지 본다(2026-10-25 실행 환경을 노드 22 로 올리며 더함).
      # 로그인 함수의 '미리 깨우기' 요청은 아무것도 읽거나 쓰지 않고 {warm:true} 만 돌려준다.
      - name: 배포 뒤 응답 확인
        run: |
          for i in 1 2 3; do
            out=$(curl -sS -m 30 -X POST -H 'Content-Type: application/json' \
              -d '{"data":{"warm":true}}' \
              https://asia-northeast3-kosai-ae167.cloudfunctions.net/socialLogin || true)
            echo "socialLogin 응답: $out" | tee -a /tmp/deploy.log
            echo "$out" | grep -q '"warm":true' && exit 0
            sleep $((i*10))
          done
          echo "로그인 함수가 응답하지 않습니다" | tee -a /tmp/deploy.log
          exit 1

      # 메일의 수신거부 링크가 부르는 함수(unsubscribeMarketing · 2026-10-29)는 로그인 없이 불린다 — 공개 호출로 올라갔는지
      # 빈 요청으로 본다. 회원 번호 · 표가 없으면 아무것도 읽거나 바꾸지 않고 INVALID_ARGUMENT('링크가 올바르지 않습니다')로 돌려준다.
      - name: 수신거부 함수 응답 확인
        run: |
          for i in 1 2 3; do
            out=$(curl -sS -m 30 -X POST -H 'Content-Type: application/json' \
              -d '{"data":{}}' \
              https://asia-northeast3-kosai-ae167.cloudfunctions.net/unsubscribeMarketing || true)
            echo "unsubscribeMarketing 응답: $out" | tee -a /tmp/deploy.log
            echo "$out" | grep -q 'INVALID_ARGUMENT' && exit 0
            sleep $((i*10))
          done
          echo "수신거부 함수가 응답하지 않습니다" | tee -a /tmp/deploy.log
          exit 1

      # 비밀값 옛 버전 정리 — 함수가 가리키는 버전과 가장 새 버전만 남기고 지운다(2026-11-05 · scripts/secret_versions.py).
      # 함수 목록을 못 받거나 가리키는 버전이 켜짐이 아니면 아무것도 지우지 않고 실패로 끝난다(배포 로그는 아래에서 남는다).
      - name: 비밀값 옛 버전 정리
        run: |
          set -o pipefail
          python3 scripts/secret_versions.py --apply 2>&1 | tee -a /tmp/deploy.log

      - name: 배포 로그 저장(디버그)
        if: always()
        run: |
          mkdir -p data
          cp /tmp/deploy.log data/deploy_functions.log 2>/dev/null || echo "(no log)" > data/deploy_functions.log
          git config user.email "bot@kosai.kr"
          git config user.name "deploy-bot"
          git add data/deploy_functions.log
          git commit -m "🚀 함수 배포 로그" || echo "no change"
          git push || echo "push failed"
