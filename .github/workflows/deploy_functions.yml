name: 🚀 Firebase 배포 (함수 · Firestore 규칙)

# 터미널 없이 GitHub에서 배포. 수동 실행(원할 때만).
#
# 규칙(firestore.rules)도 여기서 배포한다. 전에는 함수만 배포해서 저장소의
# 규칙과 실제 규칙이 갈라졌다 — users 컬렉션을 열어 주는 규칙을 커밋했는데
# 실사이트에서는 계속 거부됐고, 동의 기록이 조용히 저장되지 않았다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 함수 의존성 설치
        run: cd functions && npm install

      - name: firebase-tools 설치
        run: npm install -g firebase-tools

      - name: 서비스 계정 인증
        env:
          SA: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$SA" > "$HOME/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/sa.json" >> "$GITHUB_ENV"

      - name: RESEND_API_KEY 시크릿 등록
        env:
          RK: ${{ secrets.RESEND_API_KEY }}
        run: |
          printf '%s' "$RK" | firebase functions:secrets:set RESEND_API_KEY \
            --data-file=- --project kosai-ae167 --force

      - name: 배포 (함수 + Firestore 규칙)
        run: |
          set -o pipefail
          firebase deploy --only functions,firestore:rules \
            --project kosai-ae167 --non-interactive --force 2>&1 | tee /tmp/deploy.log

      - name: 배포 로그 저장(디버그)
        if: always()
        run: |
          mkdir -p data
          cp /tmp/deploy.log data/deploy_functions.log 2>/dev/null || echo "(no log)" > data/deploy_functions.log
          git config user.email "bot@kosai.kr"
          git config user.name "deploy-bot"
          git add data/deploy_functions.log
          git commit -m "🚀 함수 배포 로그" || echo "no change"
          git push || echo "push failed"
