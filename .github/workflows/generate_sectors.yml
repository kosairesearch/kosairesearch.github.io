name: 🏭 업종 AI 분석 생성

on:
  schedule:
    # 분기 1회 · 정기보고서 마감 한 주 뒤 11:00 KST 에 전 업종 재생성.
    #
    # 업종 분석에 새로 들어갈 사실은 공시로만 들어온다. 공시 전에 돌리면 새
    # 숫자를 못 본 글을 다음 분기까지 걸어 두게 된다.
    #
    #   사업보고서   3월 31일  →   4월  7일   (+7일)
    #   1분기        5월 15일  →   5월 21일   (+6일)
    #   반기         8월 14일  →   8월 21일   (+7일)
    #   3분기       11월 14일  →  11월 21일   (+7일)
    #
    # 마감 '당일' 로 붙이지는 않는다. 두 가지 이유다.
    #   · 마감일은 제출이 몰리는 날이다. 우리 데이터는 매 거래일 저녁에
    #     정리되므로 최소 하루는 지나야 반영된다.
    #   · 업종 분석은 개별 회사 숫자가 아니라 업황을 쓰는 글이라, 만들 때
    #     웹 검색으로 최근 업황을 확인한다. 발표 당일에는 증권사·언론 해설이
    #     아직 없어 검색해도 참고할 것이 없다. 한 주면 쌓인다.
    #
    # 옛 일정 두 가지가 다 어긋나 있었다.
    #   1·4·7·10월 1일  — 실적 시즌 '직전' 이라 새 숫자를 못 봤다
    #   4·6·9·12월 5일  — 공시 뒤이긴 한데 1분기·반기·3분기가 3주씩 늦었다
    #
    # 4월만 날짜가 다른 이유는, 사업보고서 마감(3/31)이 다른 셋(15일·14일)과
    # 열흘 이상 떨어져 있어서다. 한 줄로 묶으면 어느 한쪽이 반드시 어긋난다.
    #
    # GitHub 크론은 UTC 로만 해석하므로 02:00 UTC 로 적는다(= 같은 날 11:00 KST).
    # UTC 15시 이후로 잡으면 한국 날짜가 하루 밀리므로 00~14시 사이를 쓸 것.
    # 크론은 자주 지연된다(관측 66분~4시간48분). 시각보다 '그날 안에' 도는 것이 중요.
    - cron: '0 2 7 4 *'
    - cron: '0 2 21 5,8,11 *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'submit / collect / auto'
        type: choice
        options: [auto, submit, collect]
        default: auto
      force:
        description: '전 업종 재생성'
        type: choice
        options: ['no', 'yes']
        default: 'no'

concurrency:
  group: kos-data
  cancel-in-progress: false

jobs:
  sectors:
    runs-on: ubuntu-latest
    # 배치 회수까지 한 잡에서 기다린다. 31개 업종이면 제출~회수에 시간이 걸린다.
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 업종 분석 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPORT_MODEL: claude-sonnet-5
          # 정기 실행은 항상 전 업종 재생성. 이게 없으면 submit() 의
          # `FORCE or s not in existing` 조건에 걸려 '대상 0개'로 조용히 끝난다
          # (실제로 7·8월 크론이 그렇게 아무것도 안 하고 성공으로 끝났다).
          SECTOR_FORCE: ${{ (github.event_name == 'schedule' || inputs.force == 'yes') && '1' || '' }}
          # 31개 배치 회수까지 최대 5시간 대기(기본 80분으로는 부족).
          BATCH_MAX_WAIT_SEC: '18000'
        # schedule 이벤트에는 inputs 가 없어 빈 문자열이 넘어간다 → auto 로 명시.
        #
        # set -o pipefail 이 없으면 파이프의 끝(tee)이 성공했다는 이유로 이 단계가
        # 초록으로 끝난다. 파이썬이 죽어도, 열쇠가 없어도, 아무것도 못 만들어도
        # 실행 기록은 '성공' 이다 — 7·8월 크론이 아무것도 안 하고 성공으로
        # 끝났던 것과 같은 종류의 조용한 실패다. 여기서 막는다.
        run: |
          set -o pipefail
          python scripts/generate_sectors.py "${{ inputs.mode || 'auto' }}" 2>&1 | tee -a data/sectors_run.log
      - name: 커밋 & 푸시
        if: always()
        run: |
          git config --global user.email "bot@kosairesearch.github.io"
          git config --global user.name "KOS ai Bot"
          git add -A data/
          git commit -m "🏭 업종 AI 분석 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')" || echo "변경 없음"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase -X theirs origin/main && git push origin main && break
            echo "push 재시도 $i..."; sleep $((i*3))
          done
