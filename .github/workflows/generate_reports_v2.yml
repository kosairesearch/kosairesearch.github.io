name: 리포트 v2 생성 (정량+정성 · Batch)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'quant(검증) | patch(숫자만 교체·무료) | submit | pickup | auto | recover'
        default: 'quant'
      tickers:
        description: '쉼표 구분 티커 (비우면 시총 상위 N)'
        default: ''
      top_n:
        description: '시총 상위 N개 (tickers 비울 때 적용 / fill 청크 크기)'
        default: '10'
      fill_to:
        description: '자동 백필: 시총 상위 N위까지 채울 때까지 self-chain (0=비활성)'
        default: '0'
      fill_from:
        description: '백필 시작 시총 순위(이 순위부터). 병렬 구간 분담용'
        default: '0'
      fill_shards:
        description: '백필 샤드 총 개수(병렬 run 수). 1=단일'
        default: '1'
      fill_shard:
        description: '이 run의 샤드 인덱스(0..shards-1)'
        default: '0'
      backfill:
        description: 'skip 재시도 run(backfill_missing 이 켠다). 1이면 재무제표가 또 없을 때 skip 날짜를 갱신'
        default: '0'
      dump_eps:
        description: '주당이익 원문을 로그에 찍을 티커(쉼표)'
        default: ''
      recover_batch_id:
        description: 'recover 모드용 배치 ID(비우면 최근 배치)'
        default: ''

# run마다 독립 그룹 → 백필 청크를 병렬 실행 가능(각 run은 별도 체크아웃, 파일 충돌 없음).
concurrency:
  group: kos-reports-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  reports-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 백필 진행 측정(시작)
        id: before
        run: |
          n=$(ls data/reports_v2/*.json 2>/dev/null | wc -l | tr -d ' ')
          b=$(ls data/batches_v2/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "batches=$b" >> "$GITHUB_OUTPUT"
          echo "시작 v2 리포트 수: $n · 배치 상태 파일 $b"

      - name: 리포트 v2 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          REPORT_MODEL_TOP: 'claude-opus-5'
          REPORT_MODEL_REST: 'claude-sonnet-5'
          REPORT_MODEL_TOP_N: '300'
          REPORT_TICKERS: ${{ inputs.tickers }}
          REPORT_TOP_N: ${{ inputs.top_n }}
          REPORT_FILL_TO: ${{ inputs.fill_to }}
          REPORT_FILL_FROM: ${{ inputs.fill_from }}
          REPORT_FILL_SHARDS: ${{ inputs.fill_shards }}
          REPORT_FILL_SHARD: ${{ inputs.fill_shard }}
          REPORT_BACKFILL: ${{ inputs.backfill }}
          RECOVER_BATCH_ID: ${{ inputs.recover_batch_id }}
          BATCH_MAX_WAIT_SEC: '18000'
          # auto 가 주문 뒤 그 자리에서 기다리는 시간. 30분마다 돌게 해 둔 collect_batch·
          # 워치독 크론이 실제로는 4시간 간격으로만 뜬다(00:41·05:25·09:49·13:57 —
          # GitHub 가 혼잡 시간대에 예약 실행을 미룬다). 100건 배치는 대개 한 시간
          # 안에 끝나므로 여기서 한 시간까지 기다리면 대부분 그 자리에서 회수되고
          # self-chain 이 바로 다음 청크로 이어진다 — 크론 간격에 매이지 않는다.
          # 안 끝난 배치는 상태 파일이 커밋돼 있으니 collect_batch 가 나중에 받는다.
          BATCH_SHORT_WAIT_SEC: '3600'
          DUMP_EPS: ${{ inputs.dump_eps }}
        id: run
        run: |
          # tee 를 거치면 파이프의 종료 코드가 tee 의 것이 되고, 뒤의 '|| true' 까지
          # 있어서 스크립트가 죽어도 잡이 '성공' 으로 찍혔다. 실제로 DART 하루 호출
          # 한도를 넘겨 8개 run 이 1분 만에 빈손으로 끝났는데 전부 초록불이었다.
          # 부분 결과는 그대로 커밋해야 하므로 여기서 죽이지는 않고, 코드를 남겨
          # 커밋 뒤에 잡을 실패로 표시한다.
          set +e
          python scripts/generate_reports_v2.py "${{ inputs.mode }}" 2>&1 | tee data/reports_v2_run.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "스크립트 종료 코드: $code"
          exit 0

      - name: 결과 커밋
        run: |
          git config --global user.email "bot@kosairesearch.github.io"
          git config --global user.name "KOS ai Bot"
          # 병렬 run은 '서로 겹치지 않는' 파일만 커밋한다 — 종목별 리포트 JSON, 종목별
          # 마커(skip·hold·fail), 그리고 이 run 이 넣은 주문의 상태 파일(배치 ID 이름).
          #
          # 배치 상태 파일은 반드시 커밋한다. auto 는 주문만 넣고 30분 뒤 끝나므로,
          # 이 파일이 main 에 없으면 collect_batch 가 무엇을 회수해야 하는지 모른다 —
          # 돈은 나가고 리포트는 안 들어온다. 예전에는 여기서 batch_state 를 되돌렸다.
          #
          # 전역 파일(reports-index.js·index.json·run.log)은 커밋하지 않아 rebase 충돌이
          # 없다. reports-index.js 는 워치독의 reindex(단일 직렬)가 재생성한다.
          for p in data/reports_v2 data/reports_v2_skip data/reports_v2_hold data/reports_v2_fail \
                   data/batches_v2 data/dart_quota_exhausted data/anthropic_credit_exhausted \
                   data/_debug_eps.txt; do
            [ -e "$p" ] && git add -A "$p"
          done
          git reset -q data/reports_v2/index.json 2>/dev/null || true
          # 스크립트가 건드린 전역 파일은 되돌려 rebase를 깨끗하게 유지
          git checkout -q -- data/reports_v2_run.log data/reports-index.js data/reports_v2/index.json 2>/dev/null || true
          git commit -m "📊 리포트 v2 (${{ inputs.mode }}) $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')" || exit 0
          # 겹치지 않는 파일만 커밋하므로 rebase는 항상 깨끗. 재시도+랜덤 백오프로 push 창 확보.
          ok=""
          for i in $(seq 1 25); do
            git fetch origin main -q 2>/dev/null || true
            if git rebase origin/main 2>/dev/null && git push origin main 2>/dev/null; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 9) + 2 ))
          done
          [ -n "$ok" ] || exit 1

      # 스크립트가 오류로 끝났으면 잡을 실패로 표시한다. 부분 결과는 위에서 이미
      # 커밋했으므로 잃는 것은 없고, 대신 초록불에 속지 않는다.
      #   3 = DART 를 쓸 수 없음(하루 한도·점검·키). 종목 탓이 아니라 skip 을 남기지 않았다.
      #   4 = 모델 계정이 막힘(잔액·인증). 역시 종목 탓이 아니라 실패 마커를 남기지 않았고,
      #       회수 중이었다면 배치 상태 파일도 그대로 둔다(이미 낸 돈을 지키려고).
      - name: 실행 실패 표시
        if: ${{ steps.run.outputs.code != '0' }}
        run: |
          echo "⛔ 스크립트가 오류로 끝났다 (종료 코드 ${{ steps.run.outputs.code }})" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.run.outputs.code }}" = "3" ]; then
            echo "원인: DART 를 쓸 수 없음 — 하루 호출 한도 초과(한국시간 자정에 풀린다)·점검·키 문제. 로그의 'DART status' 줄 참고." >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.run.outputs.code }}" = "4" ]; then
            echo "원인: Anthropic 계정을 쓸 수 없음 — 크레딧 잔액 부족이나 인증 문제." >> $GITHUB_STEP_SUMMARY
            echo "조치: console.anthropic.com 에서 충전한 뒤 data/anthropic_credit_exhausted 를 지우면 다음 크론에서 이어받는다." >> $GITHUB_STEP_SUMMARY
          fi
          tail -30 data/reports_v2_run.log 2>/dev/null || true
          exit 1

      # 자동 백필 self-chain: 상위 fill_to개 중 남은 종목이 있고 이번에 진척(주문 또는
      # 회수)이 있었으면 다음 청크를 바로 잇는다. 진척 0 이면 멈춰서 무한루프를 막는다.
      # 끊겨도 워치독(30분)이 다시 잇는다 — 이 단계는 속도를 위한 것이다.
      - name: 다음 청크 self-chain
        if: ${{ steps.run.outputs.code == '0' && inputs.fill_to != '0' && inputs.fill_to != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          before='${{ steps.before.outputs.count }}'
          after=$(ls data/reports_v2/*.json 2>/dev/null | wc -l | tr -d ' ')
          b_before='${{ steps.before.outputs.batches }}'
          b_after=$(ls data/batches_v2/*.json 2>/dev/null | wc -l | tr -d ' ')
          remaining=$(python scripts/_fill_remaining.py '${{ inputs.fill_to }}')
          added=$(( after - before ))
          submitted=$(( b_after - b_before ))
          echo "백필: 리포트 $before → $after (+$added) · 주문 +$submitted · 상위 ${{ inputs.fill_to }} 남은 $remaining"
          if [ "$remaining" -gt 0 ] && { [ "$added" -gt 0 ] || [ "$submitted" -gt 0 ]; }; then
            echo "→ 다음 청크 재실행(샤드 ${{ inputs.fill_shard }}/${{ inputs.fill_shards }}, 전체 남은 $remaining개)"
            gh workflow run generate_reports_v2.yml \
              -f mode=auto -f top_n='${{ inputs.top_n }}' -f fill_to='${{ inputs.fill_to }}' \
              -f fill_from='${{ inputs.fill_from }}' -f fill_shards='${{ inputs.fill_shards }}' -f fill_shard='${{ inputs.fill_shard }}'
          else
            echo "→ 이 샤드 종료(전체 남은 $remaining개, 이번 진척 리포트 $added·주문 $submitted)"
          fi
