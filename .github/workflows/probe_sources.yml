name: 🔎 브리핑 데이터 소스 판정 (수동)

# 모닝 브리핑에 넣을 값들을 어디서 가져올지 정하기 위한 일회성 점검.
# 아무것도 커밋하지 않고, 되는 소스와 안 되는 소스만 로그로 알려준다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt yfinance holidays

      - name: 소스 판정
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
        run: python scripts/probe_sources.py --raw

      # 잠깐 붙인 조사 — 금통위 목록을 실제로 주는 주소를 찾는다.
      # 찾으면 calendar_data.py 에 적고 이 단계와 scripts/_bok_probe.py 는 지운다.
      - name: 금통위 목록 주소 찾기
        if: always()
        run: python scripts/_bok_probe.py

      # 목록이 화면에서 그려지므로 실제 브라우저로 띄워 표를 읽는다.
      # 먼저 보기만 한다 — 내용이 맞는지 눈으로 확인한 뒤에 쓰게 한다.
      - name: 금통위 일정 브라우저로 읽어 보기
        if: always()
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python scripts/bok_schedule.py --year 2026 || true
