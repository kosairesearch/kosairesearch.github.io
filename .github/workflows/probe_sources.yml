name: 🔎 브리핑 데이터 소스 판정 (수동)

# 모닝 브리핑에 넣을 값들을 어디서 가져올지 정하기 위한 일회성 점검.
# 아무것도 커밋하지 않고, 되는 소스와 안 되는 소스만 로그로 알려준다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt lxml

      - name: 상장 예정 종목 자료원 판정(임시 · 작업 가지에서만)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          python scripts/ipo_reports.py scan 2>&1 | sed -u 's/\(로그인 ID: \).*/\1(가림)/'
