name: 🤖📦 AI 리포트 대량 생성 (Batch · 50%↓)

on:
  # 비용 발생 — 원할 때만 수동 실행
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 (auto=제출+회수 / submit=제출만 / collect=회수만 / dump=저장하지 못한 글의 사정만 · 돈 안 듦)'
        type: choice
        default: auto
        options: [auto, submit, collect, dump]
      top_n:
        description: '대상 종목 수 (시총 상위 N개)'
        type: string
        default: '100'
      tickers:
        description: '특정 종목만 (쉼표구분 6자리코드, 비우면 top_n 사용)'
        type: string
        default: ''
      force:
        description: '이미 있는 리포트도 강제 재생성 (분량/포맷 변경 반영용)'
        type: choice
        default: 'no'
        options: ['no', 'yes']
      batch_id:
        description: 'dump 만 — 읽을 배치(msgbatch_…) · 비우면 상태 파일의 배치. 리포트 v2 배치도 읽는다'
        type: string
        default: ''

# 데이터 쓰기 워크플로 동시 실행 금지(커밋 레이스로 결과 유실 방지)
concurrency:
  group: kos-data
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 최신 시세 갱신 (collect · dump 모드에서는 생략)
        if: ${{ inputs.mode != 'collect' && inputs.mode != 'dump' }}
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          mkdir -p data
          python scripts/collect_data.py 2>&1 | tee data/run.log || echo "(시세 갱신 실패 — 기존 데이터 사용)"

      - name: 배치 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          REPORT_MODEL: 'claude-haiku-5-5'   # 2026-11-08 사장 "모든 종목 리포트를 … 다 하이쿠로 · 무조건 batch api" — 저장소 변수로 바꾸지 않게 고정
          REPORT_TOP_N: ${{ inputs.top_n || '100' }}
          REPORT_TICKERS: ${{ inputs.tickers || '' }}
          REPORT_FORCE: ${{ inputs.force == 'yes' && '1' || '' }}
          DUMP_BATCH_ID: ${{ inputs.batch_id || '' }}
          BATCH_MAX_WAIT_SEC: '18000'
        run: |
          set -o pipefail
          mkdir -p data
          echo "=== 배치(${{ inputs.mode }}) 시작 $(date -u) ===" > data/reports_run.log
          python scripts/generate_reports_batch.py "${{ inputs.mode }}" 2>&1 | tee -a data/reports_run.log

      # dump 는 읽기만 한다 — 커밋하지 않는다.
      - name: 변경사항 커밋 & 푸시
        if: ${{ always() && inputs.mode != 'dump' }}
        run: |
          git config --global user.email "bot@kosairesearch.github.io"
          git config --global user.name "KOS ai Bot"
          git add -A data/
          git commit --allow-empty -m "🤖📦 AI 리포트 배치 ${{ inputs.mode }} $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
          # 받아 합치기 · 충돌 · 재시도 · 실패 처리는 공용 단계가 한다(scripts/push_main.sh · 2026-11-13).
          bash scripts/push_main.sh
