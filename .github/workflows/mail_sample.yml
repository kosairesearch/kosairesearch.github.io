name: 📧 수신거부 메일 시험 발송

# 마케팅 수신 동의 2년 재확인 메일을 관리자 주소(hello@kosai.kr)로 한 통 보낸다 — 제목 앞 [시험].
# 실제 발송과 같은 코드(functions/index.js 의 adminMarketingRecheck sample)로 만든다. 메일 아래의 수신거부 링크는
# 관리자 계정의 실제 링크라, 누르고 '수신 거부하기'까지 하면 그 계정의 마케팅 수신 동의가 실제로 철회된다(설정 화면에서
# 다시 켤 수 있다). 받는 주소는 바꿀 수 없다. 수동 실행만 — 예약을 걸지 말 것.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 함수 의존성 설치
        run: cd functions && npm install --no-audit --no-fund

      - name: 서비스 계정 인증
        env:
          SA: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$SA" > "$HOME/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/sa.json" >> "$GITHUB_ENV"

      # 기록은 공개다 — 스크립트는 링크 · 표 · 회원 번호를 찍지 않는다.
      - name: 시험 메일 발송
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GCLOUD_PROJECT: kosai-ae167
          GOOGLE_CLOUD_PROJECT: kosai-ae167
        run: node scripts/send_recheck_sample.cjs
