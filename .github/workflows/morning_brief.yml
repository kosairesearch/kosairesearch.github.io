name: 📰 모닝 브리핑

# 국내 증시가 열리는 날 아침, kosai.kr/brief.html 에 그날 브리핑을 올린다.
#
# 만드는 것과 올리는 것을 나눴다. 06:00 에 만들어 두고 06:40 슬롯에서 올린다.
# 만드는 건 여러 번 시도해도 되지만 올리는 건 정해진 시각에 한 번이다.
#
# 발행 시각은 cron 에 맡기지 않는다. GitHub 스케줄은 부하가 높으면 밀리는데,
# 실제로 사흘을 재 보니 슬롯마다 밀리는 폭이 달랐다.
#
#   예정 21:00Z → 21:18~21:20 (+18~20분)
#   예정 21:40Z → 21:56~21:58 (+16~18분)
#   예정 22:10Z → 22:38, 22:38 (+28분 · 이틀 다 같은 분)
#
# 그래서 22:10 슬롯에 발행을 맡겼더니 07:38 에 깨어났고, "07:28 까지 기다린다"는
# 계산이 늘 음수가 되어 대기 없이 그대로 나갔다 — 사흘 연속 07:37·07:39·07:39.
# 발행을 21:40 슬롯(≈06:57 KST 발화)으로 옮긴다. 07:28 까지 30분쯤 남으므로
# 이제 기다릴 여유가 생긴다. 22:10 슬롯은 그 앞이 실패했을 때만 뒤늦게라도
# 올리는 예비로 남긴다.
#
# 휴장일에는 아무것도 하지 않는다. 주말·공휴일·대체공휴일 모두 포함이고 판정은
# holidays 패키지가 한다(2026-08-17 광복절 대체공휴일을 정확히 잡았다).
# 개장 여부를 판정하지 못하면 발행하지 않는다 — 대체할 수 없는 값이다.
#
# 새 브리핑을 만들지 못한 날에는 brief.html 을 건드리지 않는다. 그러면 전날
# 브리핑이 그 자리에 남는다. 빈 페이지가 뜨는 것보다 낫다.
on:
  schedule:
    # UTC. UTC 일~목이 KST 월~금이고, 세 시각이 모두 같은 UTC 날짜에 든다.
    - cron: '0 21 * * 0-4'      # KST 06:00 — 만들기만
    - cron: '40 21 * * 0-4'     # KST 06:40 — 만들고, 07:28 까지 기다렸다 올린다
    - cron: '10 22 * * 0-4'     # KST 07:10 — 예비. 아직 안 올라갔을 때만 올린다
  workflow_dispatch:
    inputs:
      force:
        description: '같은 날 브리핑이 이미 있어도 다시 만든다'
        type: boolean
        default: false
      allow_closed:
        description: '휴장일에도 만든다 (품질 확인용)'
        type: boolean
        default: false
      publish:
        description: '실사이트에 올린다 (끄면 브리핑만 만들고 페이지는 그대로)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # 06:00 시도가 도는 중에 06:40 이 겹치면 같은 브리핑을 두 번 만든다.
  group: morning-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    # 07:30 에 나가야 한다. 늦게 나가는 것보다 실패하는 게 낫다 — 실패는 눈에
    # 보이지만 늦음은 조용하다.
    #
    # 발행 슬롯은 07:28 까지 잡 안에서 기다린다. 06:57 에 깨어나 본문을 만들고
    # 나면 20분 넘게 잠들어 있으므로 넉넉히 잡는다 — 25분이면 대기 도중에
    # 잘린다.
    timeout-minutes: 50
    steps:
      # main 하나만 본다. brief.html·스크립트·data/ 가 모두 여기 있다.
      # (전에는 브랜치와 main 을 둘 다 체크아웃했는데, 브랜치의 stocks.js 가
      #  8월 4일에 멈춰 있어 8월 14일 장을 그 데이터로 쓰는 사고가 났다.)
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      # ① 장이 열리는 날인가. 안 열리면 여기서 끝낸다 — API 도 부르지 않고
      #    페이지도 건드리지 않는다. 워크플로는 초록으로 끝난다(주말마다 붉은
      #    X 가 뜨면 정작 봐야 할 실패와 구분이 안 된다).
      - name: ① 개장 여부
        id: gate
        run: |
          python - <<'PY' >> $GITHUB_OUTPUT
          import sys
          sys.path.insert(0, "scripts")
          from market_data import open_today
          is_open, around = open_today()
          print(f"open={'true' if is_open else 'false'}")
          print(f"known={'false' if is_open is None else 'true'}")
          print(f"next={(around or {}).get('next', '')}")
          PY
          cat $GITHUB_OUTPUT

      - name: 휴장일 — 아무것도 하지 않는다
        if: steps.gate.outputs.open != 'true' && inputs.allow_closed != true
        run: |
          if [ "${{ steps.gate.outputs.known }}" = "false" ]; then
            echo "::warning::개장 여부를 판정하지 못했다 — 발행하지 않는다"
            echo "⚠️ 개장 여부 판정 실패 — 발행하지 않음" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "오늘은 국내 증시 휴장 — 브리핑을 만들지 않습니다." >> $GITHUB_STEP_SUMMARY
          echo "다음 개장: ${{ steps.gate.outputs.next }} · 페이지는 전날 브리핑을 그대로 둡니다." \
            >> $GITHUB_STEP_SUMMARY

      - name: 공시 목록 캐시 복원
        if: steps.gate.outputs.open == 'true' || inputs.allow_closed == true
        uses: actions/cache@v4
        with:
          path: data/brief_cache
          key: brief-cache-${{ github.run_id }}
          restore-keys: |
            brief-cache-

      # 과금 전에 막는다. 검증기가 깨진 채로 생성하면 돈만 쓰고 거부된다.
      - name: ② 회귀 테스트 (네트워크·과금 없음)
        if: steps.gate.outputs.open == 'true' || inputs.allow_closed == true
        run: |
          python scripts/test_flows.py
          python scripts/test_brief_gen.py

      - name: ③ 본문 생성 (Anthropic API · 한 편 약 350~430원)
        if: steps.gate.outputs.open == 'true' || inputs.allow_closed == true
        id: gen
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          BRIEF_MODEL: claude-opus-5
        run: |
          python scripts/generate_brief.py \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.allow_closed && '--allow-closed' || '' }}
          # 오늘 자 브리핑이 실제로 생겼는지 확인한다. 없으면 페이지를 건드리지
          # 않아야 하므로(전날 글 유지) 여기서 갈라 둔다.
          D=$(TZ='Asia/Seoul' date +'%Y-%m-%d')
          if [ -f "data/briefs/$D.json" ]; then
            echo "have=true"  >> $GITHUB_OUTPUT
            echo "date=$D"    >> $GITHUB_OUTPUT
          else
            echo "have=false" >> $GITHUB_OUTPUT
            echo "::warning::오늘 자 브리핑이 없다 — 페이지는 전날 글을 그대로 둔다"
          fi

      # ④ 실사이트 페이지에 반영. 06:40 슬롯이 맡고, 07:10 슬롯은 그때 못 올라간
      #    경우에만 뒤늦게 올린다. 06:00 은 만들어 두는 데까지다.
      - name: ④ brief.html 에 반영 (07:28 KST 발행)
        id: render
        if: |
          steps.gen.outputs.have == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.publish == false) &&
          (github.event_name != 'schedule' ||
           github.event.schedule == '40 21 * * 0-4' ||
           github.event.schedule == '10 22 * * 0-4')
        run: |
          # 이미 올라갔으면 손대지 않는다. 07:10 예비 슬롯이 06:40 슬롯의 글을
          # 07:39 에 덮어써서 발행 시각만 뒤로 밀어 놓는 일을 막는다. 판정은
          # meta.publishedAt 로 한다 — render_brief 가 페이지를 쓸 때만 남기는
          # 값이라, 만들어만 두고 안 올린 브리핑과 구분된다.
          D=${{ steps.gen.outputs.date }}
          if python - "$D" <<'PY'
          import json, sys
          m = json.load(open(f"data/briefs/{sys.argv[1]}.json", encoding="utf-8")).get("meta") or {}
          sys.exit(0 if m.get("publishedAt") else 1)
          PY
          then
            echo "이미 $D 브리핑이 올라가 있다 — 덮어쓰지 않는다"
            exit 0
          fi

          # 발행 시각을 cron 에 맡길 수 없다. 스케줄은 부하가 높으면 밀리고,
          # 밀리는 폭은 슬롯마다 다르다(파일 맨 위 표 참고). 그래서 여유가 큰
          # 06:40 슬롯에서 깨어나 정확한 시각까지 기다린다. 그래도 늦게 떴으면
          # 기다리지 않고 바로 간다 — 07:39 이라도 나가는 게 낫다.
          # Pages 배포에 1~2분 걸리므로 07:28 에 올리면 화면에는 07:30 안팎이다.
          TARGET=$(TZ='Asia/Seoul' date -d 'today 07:28' +%s)
          NOW=$(date +%s)
          WAIT=$(( TARGET - NOW ))
          if [ "$WAIT" -gt 0 ] && [ "$WAIT" -le 3600 ]; then
            echo "07:28 KST 까지 ${WAIT}초 대기 (지금 $(TZ='Asia/Seoul' date +%H:%M))"
            sleep "$WAIT"
          else
            echo "대기 없음 (지금 $(TZ='Asia/Seoul' date +%H:%M) · 계산된 대기 ${WAIT}초)"
          fi
          python scripts/render_brief.py --date "$D"

      - name: ⑤ 결과 요약
        if: steps.gen.outputs.have == 'true'
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, glob
          f = sorted(glob.glob("data/briefs/*.json"))[-1]
          d = json.load(open(f, encoding="utf-8"))
          m = d.get("meta") or {}
          u = m.get("usage") or {}
          print(f"## {d['title']['ko']}\n")
          print(f"- `{f}` · 거래일 {d['tradeDate']}")
          print(f"- {m.get('chars'):,}자 · 커버리지 {m.get('coverageRatio', 0)*100:.0f}% · "
                f"모델 {m.get('model')}")
          if u:
              print(f"- 입력 {u.get('inputTokens'):,} / 출력 {u.get('outputTokens'):,} 토큰 · "
                    f"${u.get('usd')} (약 {u.get('krw'):,}원)")
          print(f"\n> {d['lead']['ko']}\n")
          for s in d["sections"]:
              print(f"### {s['heading']['ko']}")
              for p in s["paragraphs"]:
                  print(p["ko"] + "\n")
          PY

      - name: ⑥ 커밋 · 배포
        if: steps.gen.outputs.have == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # brief.html 은 ④가 돌았을 때만 바뀐다. 안 돌았으면 브리핑 JSON 만
          # 커밋되고 페이지는 전날 글을 그대로 유지한다.
          git add data/briefs brief.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않는다"; exit 0
          fi
          if [ "${{ steps.render.outcome }}" = "success" ]; then
            MSG="📰 모닝 브리핑 ${{ steps.gen.outputs.date }}"
          else
            MSG="📰 모닝 브리핑 초안 ${{ steps.gen.outputs.date }} (발행 대기)"
          fi
          git commit -m "$MSG"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "재시도 $i"; sleep $((i*4))
          done
          if [ "${{ steps.render.outcome }}" = "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "→ https://kosai.kr/brief.html" >> $GITHUB_STEP_SUMMARY
          fi

      # 규칙을 통과하지 못한 결과는 커밋되지 않으므로(.gitignore) 여기서 건진다.
      - name: 거부된 결과 (실패했을 때만)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-brief
          path: data/briefs/_rejected/
          if-no-files-found: ignore
