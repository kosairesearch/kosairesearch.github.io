name: 📰 모닝 브리핑

# 국내 증시가 열리는 날 아침 07:30 KST 에 브리핑을 올린다.
#
# 세 번 시도한다(06:00 / 06:40 / 07:15 KST). 앞의 시도가 성공하면 뒤의
# 시도는 파일이 이미 있는 걸 보고 건너뛴다. 한 번에 걸지 않는 이유는
# yfinance·네이버·DART 중 하나가 잠깐 죽어도 그날 브리핑이 나가야 하기
# 때문이다.
#
# 휴장일에는 아무것도 하지 않는다. 주말·공휴일·대체공휴일 모두 포함이며,
# 판정은 holidays 패키지가 한다(2026-08-17 광복절 대체공휴일을 정확히 잡는다).
# 개장 여부를 판정하지 못하면 발행하지 않는다 — 이건 대체할 수 없는 값이다.
#
# ⚠️ cron 은 기본 브랜치(main)에서만 발동한다. 그래서 이 파일은 main 에
#    있어야 하고, 실제 작업은 아래 BRIEF_BRANCH 를 체크아웃해서 한다.
#    지금 발행 대상은 스테이징(kosai.kr/staging/brief.html)이다. 실사이트로
#    옮기려면 PUBLISH_TO 를 바꾸면 된다 — 그건 품질을 확인한 다음의 일이다.
# 생성과 발행을 나눈다. 06:00 에 만들어 두고 07:20 에만 올린다 — 앞의 시도가
# 성공하면 브리핑이 06:05 에 올라가 버리는데, 07:30 에 나가야 하는 글이다.
# 만드는 것은 여러 번 시도해도 되지만 올리는 것은 정해진 시각에 한 번이다.
on:
  schedule:
    # UTC 다. UTC 일~목이 KST 월~금이고, 세 시각이 모두 같은 UTC 날짜에 든다.
    - cron: '0 21 * * 0-4'      # KST 06:00 — 만들기만
    - cron: '40 21 * * 0-4'     # KST 06:40 — 아직 없으면 만들기
    - cron: '20 22 * * 0-4'     # KST 07:20 — 없으면 만들고, 그리고 올린다
  workflow_dispatch:
    inputs:
      force:
        description: '같은 날 브리핑이 이미 있어도 다시 만든다'
        type: boolean
        default: false
      allow_closed:
        description: '휴장일에도 만든다 (품질 확인용 · 발행용 아님)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # 브리핑 템플릿(brief.html)과 스크립트가 있는 브랜치.
  BRIEF_BRANCH: claude/report-cleanup-backfill-afybry

concurrency:
  # 06:00 시도가 아직 도는 중에 06:40 이 겹치면 같은 파일을 두 번 만든다.
  group: morning-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    # 07:30 에 나가야 한다. 늦게 나가는 것보다 실패하는 게 낫다 — 실패는
    # 눈에 보이지만 늦음은 조용하다.
    timeout-minutes: 25
    steps:
      # ① 브랜치 — 템플릿과 스크립트
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRIEF_BRANCH }}

      # ② main — 최신 시세 데이터와 스테이징 반영 대상.
      #    data/ 는 main 에서 매일 수집된다. 브랜치의 stocks.js 는 브랜치를
      #    딴 날짜에 멈춰 있어서, 1차 실행에서 8월 4일 데이터로 8월 14일
      #    장을 쓰는 일이 실제로 벌어졌다.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: _main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      # ③ 장이 열리는 날인가. 안 열리면 여기서 끝낸다 — API 도 부르지 않고
      #    커밋도 하지 않는다. 워크플로는 초록으로 끝난다(주말마다 붉은 X 가
      #    뜨면 정작 봐야 할 실패와 구분이 안 된다).
      - name: ③ 개장 여부
        id: gate
        run: |
          python - <<'PY' >> $GITHUB_OUTPUT
          import sys, datetime
          sys.path.insert(0, "scripts")
          from market_data import open_today
          is_open, around = open_today()
          print(f"open={'true' if is_open else 'false'}")
          print(f"known={'false' if is_open is None else 'true'}")
          print(f"next={(around or {}).get('next', '')}")
          PY
          cat $GITHUB_OUTPUT

      - name: 휴장일 — 아무것도 하지 않는다
        if: steps.gate.outputs.open != 'true' && inputs.allow_closed != true
        run: |
          if [ "${{ steps.gate.outputs.known }}" = "false" ]; then
            echo "::warning::개장 여부를 판정하지 못했다 — 발행하지 않는다"
            echo "⚠️ 개장 여부 판정 실패 — 발행하지 않음" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "오늘은 국내 증시 휴장 — 브리핑을 만들지 않는다." >> $GITHUB_STEP_SUMMARY
          echo "다음 개장: ${{ steps.gate.outputs.next }}" >> $GITHUB_STEP_SUMMARY

      - name: 공시 목록 캐시 복원
        if: steps.gate.outputs.open == 'true' || inputs.allow_closed == true
        uses: actions/cache@v4
        with:
          path: data/brief_cache
          key: brief-cache-${{ github.run_id }}
          restore-keys: |
            brief-cache-

      - name: ④ main 의 최신 시세·리포트로 맞춘다
        if: steps.gate.outputs.open == 'true' || inputs.allow_closed == true
        run: |
          cp _main/data/stocks.js data/stocks.js
          cp _main/data/reports-index.js data/reports-index.js
          for d in reports_v2 reports; do
            if [ -d "_main/data/$d" ]; then rm -rf "data/$d"; cp -r "_main/data/$d" "data/$d"; fi
          done
          python - <<'PY'
          import re
          m = re.search(r'"dataDate"\s*:\s*"?(\d+)', open("data/stocks.js", encoding="utf-8").read())
          print(f"data/stocks.js dataDate = {m.group(1) if m else '못 찾음'}")
          PY

      # 과금 전에 막는다. 검증기가 깨진 채로 생성하면 돈만 쓰고 거부된다.
      - name: ⑤ 회귀 테스트 (네트워크·과금 없음)
        if: steps.gate.outputs.open == 'true' || inputs.allow_closed == true
        run: |
          python scripts/test_flows.py
          python scripts/test_brief_gen.py

      - name: ⑥ 본문 생성 (Anthropic API · 한 편 약 350원)
        if: steps.gate.outputs.open == 'true' || inputs.allow_closed == true
        timeout-minutes: 15
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          BRIEF_MODEL: claude-opus-5
        run: |
          python scripts/generate_brief.py \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.allow_closed && '--allow-closed' || '' }}

      - name: ⑦ brief.html 에 반영
        if: steps.gate.outputs.open == 'true' || inputs.allow_closed == true
        run: python scripts/render_brief.py

      - name: ⑧ 결과 요약
        if: steps.gate.outputs.open == 'true' || inputs.allow_closed == true
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, glob
          fs = sorted(glob.glob("data/briefs/*.json"))
          if not fs:
              print("생성된 브리핑이 없다."); raise SystemExit
          d = json.load(open(fs[-1], encoding="utf-8"))
          m, u = d.get("meta") or {}, (d.get("meta") or {}).get("usage") or {}
          print(f"## {d['title']['ko']}\n")
          print(f"- `{fs[-1]}` · 거래일 {d['tradeDate']} · "
                f"{'개장' if d.get('marketOpen') else '휴장'}")
          print(f"- {m.get('chars'):,}자 · 커버리지 {m.get('coverageRatio', 0)*100:.0f}% · "
                f"모델 {m.get('model')}")
          if u:
              print(f"- 입력 {u.get('inputTokens'):,} / 출력 {u.get('outputTokens'):,} 토큰 · "
                    f"${u.get('usd')} (약 {u.get('krw'):,}원)")
          print(f"\n> {d['lead']['ko']}\n")
          for s in d["sections"]:
              print(f"### {s['heading']['ko']}")
              for p in s["paragraphs"]:
                  print(p["ko"] + "\n")
          PY

      - name: ⑨ 브랜치에 커밋
        if: steps.gate.outputs.open == 'true' || inputs.allow_closed == true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/briefs brief.html
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋하지 않는다"
            exit 0
          fi
          DATE=$(python -c "import glob;print(sorted(glob.glob('data/briefs/*.json'))[-1][12:22])")
          git commit -m "브리핑 $DATE"
          for i in 1 2 3; do
            git pull --rebase origin "$BRIEF_BRANCH" \
              && git push origin "HEAD:$BRIEF_BRANCH" && break
            echo "재시도 $i"; sleep $((i*4))
          done

      # ⑩ 스테이징에 올린다. 실사이트(루트 brief.html)는 건드리지 않는다 —
      #    publish_staging.py 는 /staging/ 아래에만 쓰고 noindex 를 붙인다.
      #
      #    07:20 시도에서만 올린다. 06:00 · 06:40 은 만들어 브랜치에 넣어 두는
      #    데까지다. 수동 실행은 언제 눌러도 올린다.
      - name: ⑩ 스테이징 반영 (07:20 시도와 수동 실행만)
        if: |
          (steps.gate.outputs.open == 'true' || inputs.allow_closed == true) &&
          (github.event_name != 'schedule' || github.event.schedule == '20 22 * * 0-4')
        run: |
          python scripts/publish_staging.py "$GITHUB_WORKSPACE" _main/staging
          cd _main
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add staging
          if git diff --cached --quiet; then
            echo "스테이징 변경 없음"
            exit 0
          fi
          DATE=$(python -c "import glob;print(sorted(glob.glob('../data/briefs/*.json'))[-1][15:25])")
          git commit -m "staging: 모닝 브리핑 $DATE"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            echo "재시도 $i"; sleep $((i*4))
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "→ https://kosai.kr/staging/brief.html" >> $GITHUB_STEP_SUMMARY

      # 규칙을 통과하지 못한 결과는 커밋되지 않으므로(.gitignore) 여기서 건진다.
      - name: 거부된 결과 (실패했을 때만)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rejected-brief
          path: data/briefs/_rejected/
          if-no-files-found: ignore
