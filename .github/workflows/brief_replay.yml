name: 📰 브리핑 다시 써 보기 (수동 · 발행 안 함)

# "매일 같은 내용처럼 보인다"를 고친 프롬프트가 실제로 다른 글을 만드는지
# 눈으로 보려고 만든 임시 잡이다. 지난 날짜에 실제로 쓴 재료를 그대로
# 다시 먹인다 — 재료는 같고 규칙만 다르므로 비교가 된다.
#
# 아무것도 커밋하지 않는다. 결과는 로그와 첨부파일로만 남는다.
# 정하고 나면 이 파일과 scripts/brief_replay.py 는 지운다.

on:
  workflow_dispatch:
    inputs:
      dates:
        description: '다시 써 볼 날짜(공백 구분). 비우면 최근 3일'
        default: '2026-09-11 2026-09-10 2026-09-09'

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: 다시 써 보기
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/brief_replay.py ${{ inputs.dates }}

      - name: 결과 내려받기용으로 올린다
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-replay
          path: data/_replay/
          if-no-files-found: warn
