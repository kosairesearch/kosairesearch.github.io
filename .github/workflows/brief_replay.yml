name: 📰 브리핑 다시 써 보기 (수동 · 발행 안 함)

# "매일 같은 내용처럼 보인다"를 고친 프롬프트가 실제로 다른 글을 만드는지
# 눈으로 보려고 만든 잡이다. 두 가지로 쓴다.
#
#   · 다시 써 보기 (기본) — 지난 날짜에 실제로 쓴 재료를 그대로 다시 먹인다.
#     재료는 같고 규칙만 다르므로 비교가 된다.
#   · live — 오늘 재료를 실제로 모아 처음부터 한 편 만든다. 아침 워크플로가
#     밟는 길(회귀 테스트 → 수집 → 생성 → 검사 → 그리기)을 그대로 밟되
#     발행만 하지 않는다. 규칙을 고친 날 낮에 돌려 보면, 다음 날 아침에
#     글이 검사에 막힐지 미리 안다.
#
# 아무것도 커밋하지 않는다. 결과는 로그와 첨부파일로만 남는다.

on:
  workflow_dispatch:
    inputs:
      dates:
        description: '다시 써 볼 날짜(공백 구분). 비우면 최근 3일'
        default: '2026-09-11 2026-09-10 2026-09-09'
      ref:
        description: '어느 가지의 코드로 써 볼지'
        default: 'claude/hyo-yp2qk7'
      live:
        description: '오늘 재료를 실제로 모아 처음부터 한 편 만든다 (발행 안 함)'
        type: boolean
        default: false
      repair_only:
        description: '수리 경로만 (최근 나간 글의 영문 리드를 비우고 Sonnet 이 고치는지 · 약 $0.05)'
        type: boolean
        default: false
      probe:
        description: '재료 공급처 진단만 (지수·수급 주소가 살아 있는지 · 돈 안 듦)'
        type: boolean
        default: false
      read_urls:
        description: '(임시) 러너에서 이 주소들을 읽어 글만 찍는다 · 공백 구분 · 돈 안 듦'
        default: ''
      read_follow:
        description: '(임시) 위 페이지의 링크 중 이 정규식에 맞는 것을 한 단계 더 읽는다'
        default: ''

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # 일부러 작업 가지를 꺼내 쓴다. 이 발판 파일만 main 에 있으면 되고,
      # 고친 프롬프트는 main 에 올리지 않아도 시험할 수 있다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: 다시 써 보기
        if: ${{ !inputs.live && !inputs.repair_only && !inputs.probe && inputs.read_urls == '' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/brief_replay.py ${{ inputs.dates }}

      # ── 아래는 live 일 때만. 모닝 브리핑 워크플로의 ②·③·④ 와 같은 명령이다. ──

      - name: 공시 목록 캐시 복원 (읽기만)
        if: ${{ inputs.live }}
        uses: actions/cache/restore@v4
        with:
          path: data/brief_cache
          key: brief-cache-${{ github.run_id }}
          restore-keys: |
            brief-cache-

      - name: 회귀 테스트 (아침에 도는 것과 같다)
        if: ${{ inputs.live }}
        run: |
          python scripts/test_flows.py
          python scripts/test_brief_gen.py

      # ── 수리 경로만. 생성($0.31)은 하지 않는다. 9/21 시험에서 수리가 0곳으로
      #    끝나 $0.55 를 버린 뒤에 만들었다 — 수리를 고쳤으면 이걸로 확인한다. ──
      - name: 수리 경로만 (Sonnet 한 번 · 약 $0.05)
        if: ${{ inputs.repair_only }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          F=$(ls data/briefs/20*.json | sort | tail -1)
          echo "시험 대상: $F" | tee -a $GITHUB_STEP_SUMMARY
          python scripts/generate_brief.py --repair-only "$F" 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      # ── 재료 공급처 진단. 러너의 네트워크에서만 답이 나오는 질문이다 — 샌드박스는
      #    네이버·다음이 막혀 있다. API 호출이 없으니 돈이 들지 않는다. ──
      - name: 재료 공급처 진단 (돈 안 듦)
        if: ${{ inputs.probe }}
        run: |
          set -o pipefail
          python scripts/probe_feeds.py 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      # ── (임시) 샌드박스가 못 여는 페이지를 러너에서 읽는다. API 호출 없음. ──
      - name: 페이지 읽기 (돈 안 듦)
        if: ${{ inputs.read_urls != '' }}
        env:
          URLS: ${{ inputs.read_urls }}
          FOLLOW: ${{ inputs.read_follow }}
        run: python scripts/read_pages.py $URLS --follow "$FOLLOW" --max 40

      - name: 오늘 재료로 처음부터 한 편 (발행 안 함)
        if: ${{ inputs.live }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          BRIEF_MODEL: claude-opus-5
        run: |
          # data/_replay 는 .gitignore 에 있다. 실사이트 브리핑 폴더는 건드리지 않는다.
          python scripts/generate_brief.py --out data/_replay --allow-closed
          D=$(TZ='Asia/Seoul' date +'%Y-%m-%d')
          if [ ! -f "data/_replay/$D.json" ]; then
            echo "::error::오늘 자 글이 만들어지지 않았다 ($D) — 거부된 결과는 첨부파일에 있다"
            exit 1
          fi

      - name: 화면에 그려지는지 (검사만 · 쓰지 않음)
        if: ${{ inputs.live }}
        run: |
          D=$(TZ='Asia/Seoul' date +'%Y-%m-%d')
          # 그리는 스크립트는 data/briefs 에서만 읽는다. 러너 안에서만 복사한다 — 커밋하지 않는다.
          cp "data/_replay/$D.json" "data/briefs/$D.json"
          set +e
          python scripts/render_brief.py --date "$D" --check
          RC=$?
          set -e
          # 1 은 '영문 사전에 빠진 문단' — 아침에도 발행을 막지 않는 경고다. 그 밖은 진짜 오류.
          if [ "$RC" = "1" ]; then echo "::warning::영문 사전에 빠진 문단이 있다 (발행은 된다)"; exit 0; fi
          exit "$RC"

      - name: 만든 글
        if: ${{ inputs.live }}
        run: |
          python - "$(TZ='Asia/Seoul' date +'%Y-%m-%d')" <<'PY' | tee -a $GITHUB_STEP_SUMMARY
          import json, sys
          d = json.load(open(f"data/_replay/{sys.argv[1]}.json", encoding="utf-8"))
          m = d.get("meta") or {}
          print(f"## {(d.get('title') or {}).get('ko', '(제목 없음)')}\n")
          print(f"- {m.get('chars')}자 · 커버리지 {(m.get('coverageRatio') or 0)*100:.0f}% · 모델 {m.get('model')}\n")
          print(f"> {(d.get('lead') or {}).get('ko', '')}\n")
          for s in d.get("sections") or []:
              print(f"### {(s.get('heading') or {}).get('ko', '')}")
              for p in s.get("paragraphs") or []:
                  print((p.get("ko") or "") + "\n")
          PY

      - name: 결과 내려받기용으로 올린다
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-replay
          path: data/_replay/
          if-no-files-found: warn
