name: 🏭 업종 분석 워치독 (남은 것 자동 재생성)

# 업종 분석은 분기에 한 번만 돈다. 그때 일부가 걸러지면 다음 분기까지,
# 즉 석 달을 낡은 글이 걸려 있게 된다. 사람이 알아채고 손으로 다시 돌리기
# 전까지 아무 일도 일어나지 않는다.
#
# 실제로 2026-09-04 실행에서 30개 중 11개가 걸러졌다. 그때는 이 워치독이
# 없어서 사람이 발견하고 다시 돌렸다.
#
# 여기서는 data/sector_retry.json 만 본다. 걸러진 업종이 있으면 그것만
# 다시 만들고, 없으면 아무것도 하지 않는다 — 파일이 없으면 그냥 끝난다.
#
# ■ 돈이 나가는 일이라 스스로 멈춘다
#
#   · 다시 만드는 대상은 '걸러진 것' 뿐이다(force 를 켜지 않는다).
#     11개면 11개, 1개면 1개. 30개를 통째로 다시 만들지 않는다.
#   · 같은 목록으로 계속 실패하면 시도 횟수를 세어 5번에서 멈춘다.
#     모델이 그 업종에서 계속 같은 실패를 내는 경우인데, 그때는 무한히
#     돈을 태우는 대신 사람이 봐야 한다.
#   · 하루 한 번만 본다. 배치가 한 시간 넘게 걸리기도 해서 더 자주 볼
#     이유가 없다.

on:
  schedule:
    - cron: '0 4 * * *'        # 매일 13:00 KST (04:00 UTC)
  workflow_dispatch:

concurrency:
  group: kos-data              # 생성 워크플로와 같은 그룹 — 겹쳐 돌지 않는다
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 남은 업종이 있는지 본다
        id: check
        run: |
          set -o pipefail
          python3 - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json, os, pathlib
          p = pathlib.Path("data/sector_retry.json")
          if not p.exists():
              print("go=no"); print("why=남은 업종 없음"); raise SystemExit(0)
          try:
              d = json.loads(p.read_text(encoding="utf-8"))
          except Exception as e:
              print("go=no"); print(f"why=목록을 읽지 못함({e.__class__.__name__})"); raise SystemExit(0)
          left = d.get("failed") or []
          tries = int(d.get("tries") or 0)
          if not left:
              print("go=no"); print("why=남은 업종 없음"); raise SystemExit(0)
          if tries >= 5:
              # 같은 목록으로 다섯 번 실패했다. 더 돌려도 같은 결과일
              # 가능성이 크고, 그때마다 돈이 나간다. 사람이 봐야 한다.
              print("go=no"); print(f"why=다섯 번 시도했는데 계속 남는다: {', '.join(left)}")
              raise SystemExit(0)
          print("go=yes")
          print(f"why={len(left)}개 남음(시도 {tries + 1}번째): {', '.join(left)}")
          PY

      - name: 무엇을 할지 적어 둔다
        run: echo "${{ steps.check.outputs.why }}"

      - name: 시도 횟수를 올린다
        if: steps.check.outputs.go == 'yes'
        run: |
          set -o pipefail
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/sector_retry.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          d["tries"] = int(d.get("tries") or 0) + 1
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config --global user.email "bot@kosairesearch.github.io"
          git config --global user.name "KOS ai Bot"
          git add data/sector_retry.json
          git commit -m "🏭 업종 분석 재시도 횟수 기록" || echo "변경 없음"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase -X theirs origin/main && git push origin main && break
            echo "push 재시도 $i..."; sleep $((i*3))
          done

      # 생성 워크플로를 부른다. force 는 켜지 않는다 — 걸러진 것만 다시 만든다.
      - name: 남은 업종만 다시 만든다
        if: steps.check.outputs.go == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run generate_sectors.yml \
            --repo "${{ github.repository }}" --ref main \
            -f mode=auto -f force=no
