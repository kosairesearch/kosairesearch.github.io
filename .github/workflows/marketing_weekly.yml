name: 📈 주간 성과 보고 (마케팅)

# 월요일 아침, 지난주(월~일) 성과를 GA4 에서 받아 보고서로 만들어 보낸다.
#
# 왜 주 단위인가
#   하루치는 요일마다 널뛴다. 월요일이 많고 토요일이 적은 건 매주 그런
#   것이라 좋아졌는지 나빠졌는지를 말해 주지 않는다.
#
# 숫자는 어디에 쌓나 — Firestore (비공개)
#   GA4 는 오래된 기록을 지운다(기본 14개월). 매주 받아 두면 1년 뒤에도
#   '작년 이맘때'와 비교할 수 있다.
#
#   저장소에 커밋했다가 76분간 인터넷에 열렸다(2026-09-13). 이 저장소는
#   GitHub Pages 무료 요금제라 공개여야 한다. 방문자 수·유입 경로·인기
#   페이지가 그대로 보였다. 그래서 Firestore 로 옮겼다 — 이미 있고,
#   기본이 비공개고, 영구적이다. scripts/ga4_store.py 참고.
#
# 보고를 읽고 되묻고 싶을 때 — scripts/marketing_mcp.py
#   텔레그램 보고는 한 방향이다. "네이버에서 온 사람 중 몇 명이 가입했어?"
#   같은 되묻기는 클로드 안에서 한다. 붙이는 법은 그 파일 맨 위에 적어 뒀고,
#   `python scripts/marketing_mcp.py --config` 가 설정을 뽑아 준다.
#
# 처음 한 번 해야 하는 것 (setup 을 켜고 수동 실행하면 안내가 나온다)
#   1. GA4_PROPERTY_ID 를 GitHub 시크릿에 넣는다 (GA4 관리>속성 의 숫자 9자리)
#   2. 구글 클라우드에서 'Google Analytics Data API' 를 켠다
#   3. 서비스 계정 이메일을 GA4 속성에 '뷰어'로 추가한다

on:
  schedule:
    # 월요일 09:00 KST (= 월요일 00:00 UTC). 모닝 브리핑(07:30)과 겹치지 않는다.
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      setup:
        description: '처음 설정용 — 서비스 계정 이메일만 확인하고 끝낸다'
        type: boolean
        default: false
      probe:
        description: 'GA4 에 뭘 물어볼 수 있는지 확인만 하고 끝낸다'
        type: boolean
        default: false
      weeks:
        description: '몇 주치를 받을지'
        default: '12'
      send:
        description: '텔레그램으로 보낼지'
        type: boolean
        default: true
      started:
        description: "실행 표시 — 다 한 실험 번호 (예: exp_3). 다음 주부터 효과를 잽니다"
        default: ''
      dropped:
        description: "안 하기로 한 실험 번호 (예: exp_4)"
        default: ''

permissions:
  contents: read

concurrency:
  group: marketing-weekly
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      # 처음 설정용. 서비스 계정 이메일을 찍어 준다 — 구글 콘솔을 뒤지지
      # 않아도 되게. 이메일은 비밀이 아니다(신분증이지 열쇠가 아니다).
      - name: 설정 안내 (setup 을 켰을 때만)
        if: inputs.setup == true
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python3 scripts/ga4_data.py --whoami | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "GA4_PROPERTY_ID 시크릿: ${{ secrets.GA4_PROPERTY_ID && '등록됨' || '아직 없음' }}" \
            >> $GITHUB_STEP_SUMMARY

      - name: GA4 능력 확인 (probe 를 켰을 때만)
        if: inputs.probe == true
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          python3 scripts/ga4_data.py --probe 2>&1 | tee /tmp/probe.txt
          { echo '## GA4 에서 뭘 물어볼 수 있나'; echo '```'; cat /tmp/probe.txt; echo '```'; } \
            >> $GITHUB_STEP_SUMMARY

      - name: ① GA4 에서 주간 숫자를 받는다
        if: inputs.setup != true && inputs.probe != true
        id: fetch
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          python3 scripts/ga4_data.py --weeks ${{ inputs.weeks || '12' }} --write --check

      # 휴대폰으로 보고를 읽다가 "그거 했다" 를 누를 수 있어야 한다.
      # 터미널을 열어야만 표시할 수 있으면 실험 대장은 결국 안 쓰인다.
      # ①이 실패해도 표시는 남겨야 한다. "했다"고 눌렀는데 GA4 가 말을
      # 안 들었다는 이유로 조용히 사라지면, 다음 주에 효과를 못 잰다.
      # 칸에 적힌 값은 env 로 넘긴다 — 쉘 명령줄에 그대로 붙이면 따옴표
      # 하나로 명령이 바뀐다.
      - name: 실험 대장에 표시 (번호를 적었을 때만)
        if: ${{ !cancelled() && (inputs.started != '' || inputs.dropped != '') }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          STARTED: ${{ inputs.started }}
          DROPPED: ${{ inputs.dropped }}
        run: |
          if [ -n "$STARTED" ]; then
            python3 scripts/experiments.py --start "$STARTED"
          fi
          if [ -n "$DROPPED" ]; then
            python3 scripts/experiments.py --drop "$DROPPED" --why "사장이 안 하기로 함"
          fi
          python3 scripts/experiments.py --list 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      # ①이 실패해도 여기까지는 온다. 받아 둔 지난 기록으로라도 보고서를
      # 쓸 수 있으면 쓴다 — 이번 주 숫자가 없으면 재료가 그렇게 말해 준다.
      - name: ② 보고서를 쓴다
        if: ${{ !cancelled() && inputs.setup != true && inputs.probe != true }}
        id: write
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          SEND=""
          [ "${{ inputs.send }}" != "false" ] && SEND="--send"
          python3 scripts/marketing_report.py $SEND | tee /tmp/report.md
          {
            echo "## 주간 성과 보고"
            echo ""
            cat /tmp/report.md
          } >> $GITHUB_STEP_SUMMARY
