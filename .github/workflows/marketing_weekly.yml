name: 📈 주간 성과 보고 (마케팅)

# 월요일 아침, 지난주(월~일) 성과를 GA4 에서 받아 보고서로 만들어 보낸다.
#
# 왜 주 단위인가
#   하루치는 요일마다 널뛴다. 월요일이 많고 토요일이 적은 건 매주 그런
#   것이라 좋아졌는지 나빠졌는지를 말해 주지 않는다.
#
# 숫자는 어디에 쌓나 — Firestore (비공개)
#   GA4 는 오래된 기록을 지운다(기본 14개월). 매주 받아 두면 1년 뒤에도
#   '작년 이맘때'와 비교할 수 있다.
#
#   저장소에 커밋했다가 76분간 인터넷에 열렸다(2026-09-13). 이 저장소는
#   GitHub Pages 무료 요금제라 공개여야 한다. 방문자 수·유입 경로·인기
#   페이지가 그대로 보였다. 그래서 Firestore 로 옮겼다 — 이미 있고,
#   기본이 비공개고, 영구적이다. scripts/ga4_store.py 참고.
#
# 보고는 어디로 가나 — 사장이 쓰고 있는 마케팅 창
#   월요일 10:00 KST 에 루틴이 사장의 마케팅 창으로 바로 들어가 "지난주
#   보고" 를 시킨다. 거기서 표로 읽고 그 자리에서 되물으면 된다.
#
#   전에는 매주 새 창을 하나씩 열었다. 사장이 보는 창이 아니라서 보고가
#   읽히지 않은 채로 쌓였고, 사장은 "왜 보고가 안 오냐" 고 물었다.
#   보고는 오고 있었다 — 딴 데로 가고 있었을 뿐이다(2026-09-14).
#
#   이 워크플로는 그보다 두 시간 앞서 숫자를 받아 두는 일을 한다.
#   순서가 뒤집히면 마케팅 창이 지지난주 숫자를 읽게 된다.
#
#   텔레그램은 이제 안 보낸다. 한 방향이라 되물을 수 없고, 표가 깨져서
#   읽기 힘들다고 사장이 말했다. 보내고 싶으면 수동 실행에서 send 를 켜라.
#
# 보고를 읽고 되묻고 싶을 때 — scripts/marketing_mcp.py
#   텔레그램 보고는 한 방향이다. "네이버에서 온 사람 중 몇 명이 가입했어?"
#   같은 되묻기는 클로드 안에서 한다. 붙이는 법은 그 파일 맨 위에 적어 뒀고,
#   `python scripts/marketing_mcp.py --config` 가 설정을 뽑아 준다.
#
# 처음 한 번 해야 하는 것 (setup 을 켜고 수동 실행하면 안내가 나온다)
#   1. GA4_PROPERTY_ID 를 GitHub 시크릿에 넣는다 (GA4 관리>속성 의 숫자 9자리)
#   2. 구글 클라우드에서 'Google Analytics Data API' 를 켠다
#   3. 서비스 계정 이메일을 GA4 속성에 '뷰어'로 추가한다

on:
  schedule:
    # 월요일 07:43 KST (= 일요일 22:43 UTC).
    #
    # 원래 '0 0 * * 1'(월 09:00 KST) 이었는데 한 번도 안 떴다. 만들어진 뒤
    # 예약 실행이 성공한 것이 0번이고, 돈 것은 전부 손으로 돌린 것이다.
    # 세계 표준시 자정 정각 — 전 세계가 크론을 거는 그 분이다. 모닝
    # 브리핑이 같은 이유로 정각을 이미 버렸고("정시는 전 세계가 크론을
    # 거는 분이라 제일 밀린다"), update_data 는 "혼잡 시간대에 수
    # 시간(관측상 ~7.5h)씩 지연됨" 이라고 적어 두었다.
    # 2026-09-14 관측 — x_threads('0 22 * * *')가 1시간 59분,
    # 모닝 브리핑 세 슬롯이 각각 약 2시간 늦게 떴다.
    #
    # 그래서 정각을 피하고, 10시 루틴보다 두 시간 앞에 둔다. 한두 시간
    # 밀려도 10시 전에는 들어오라는 뜻이다.
    #
    # 슬롯을 더 늘리지는 않는다. 모닝 브리핑이 여섯 개까지 늘려 봤지만
    # 2026-08-28 에 여섯이 전부 안 떴다 — 늘리는 것으로는 못 막는다는
    # 뜻이고, 늘린 만큼 저장소 전체의 크론 부하만 커진다.
    # 대신 10시 루틴이 지난주 숫자가 없으면 스스로 이 워크플로를 돌리고
    # 기다린다(trig_01YLQ8v6wy5XrSaaRpr4jnoe). 크론이 죽어도 보고는 나간다.
    - cron: '43 22 * * 0'
  workflow_dispatch:
    inputs:
      setup:
        description: '처음 설정용 — 서비스 계정 이메일만 확인하고 끝낸다'
        type: boolean
        default: false
      probe:
        description: 'GA4 에 뭘 물어볼 수 있는지 확인만 하고 끝낸다'
        type: boolean
        default: false
      weeks:
        description: '몇 주치를 받을지'
        default: '12'
      deep:
        description: '요청한 주 전부를 자세히 받는다 — 옛 주의 유입처·기기·사람 수를 채울 때 한 번'
        type: boolean
        default: false
      sheet:
        description: '시트만 다시 붙인다 — 숫자를 새로 받지도, 보고서를 쓰지도 않는다'
        type: boolean
        default: false
      send:
        description: '텔레그램으로도 보낼지 (평소엔 꺼 둔다 — 보고는 클로드 창으로 온다)'
        type: boolean
        default: false
      started:
        description: "실행 표시 — 다 한 실험 번호 (예: exp_3). 다음 주부터 효과를 잽니다"
        default: ''
      dropped:
        description: "안 하기로 한 실험 번호 (예: exp_4)"
        default: ''

permissions:
  contents: read

concurrency:
  group: marketing-weekly
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      # 처음 설정용. 서비스 계정 이메일을 찍어 준다 — 구글 콘솔을 뒤지지
      # 않아도 되게. 이메일은 비밀이 아니다(신분증이지 열쇠가 아니다).
      - name: 설정 안내 (setup 을 켰을 때만)
        if: inputs.setup == true
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          python3 scripts/ga4_data.py --whoami | tee -a $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "GA4_PROPERTY_ID 시크릿: ${{ secrets.GA4_PROPERTY_ID && '등록됨' || '아직 없음' }}" \
            >> $GITHUB_STEP_SUMMARY
          echo "MARKETING_SHEET_ID 시크릿: ${{ secrets.MARKETING_SHEET_ID && '등록됨' || '아직 없음 — 숫자를 구글 시트에 쌓으려면 scripts/marketing_sheet.py 맨 위 네 줄을 따라 하라' }}" \
            >> $GITHUB_STEP_SUMMARY

      - name: GA4 능력 확인 (probe 를 켰을 때만)
        if: inputs.probe == true
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          python3 scripts/ga4_data.py --probe 2>&1 | tee /tmp/probe.txt
          { echo '## GA4 에서 뭘 물어볼 수 있나'; echo '```'; cat /tmp/probe.txt; echo '```'; } \
            >> $GITHUB_STEP_SUMMARY

      - name: ① GA4 에서 주간 숫자를 받는다
        if: inputs.setup != true && inputs.probe != true && inputs.sheet != true
        id: fetch
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          python3 scripts/ga4_data.py --weeks ${{ inputs.weeks || '12' }} --write --check \
            ${{ inputs.deep == true && '--deep' || '' }}

      # 휴대폰으로 보고를 읽다가 "그거 했다" 를 누를 수 있어야 한다.
      # 터미널을 열어야만 표시할 수 있으면 실험 대장은 결국 안 쓰인다.
      # ①이 실패해도 표시는 남겨야 한다. "했다"고 눌렀는데 GA4 가 말을
      # 안 들었다는 이유로 조용히 사라지면, 다음 주에 효과를 못 잰다.
      # 칸에 적힌 값은 env 로 넘긴다 — 쉘 명령줄에 그대로 붙이면 따옴표
      # 하나로 명령이 바뀐다.
      - name: 실험 대장에 표시 (번호를 적었을 때만)
        if: ${{ !cancelled() && (inputs.started != '' || inputs.dropped != '') }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          STARTED: ${{ inputs.started }}
          DROPPED: ${{ inputs.dropped }}
        run: |
          if [ -n "$STARTED" ]; then
            python3 scripts/experiments.py --start "$STARTED"
          fi
          if [ -n "$DROPPED" ]; then
            python3 scripts/experiments.py --drop "$DROPPED" --why "사장이 안 하기로 함"
          fi
          python3 scripts/experiments.py --list 2>&1 | tee -a $GITHUB_STEP_SUMMARY

      # ①이 실패해도 여기까지는 온다. 받아 둔 지난 기록으로라도 보고서를
      # 쓸 수 있으면 쓴다 — 이번 주 숫자가 없으면 재료가 그렇게 말해 준다.
      - name: ② 보고서를 쓴다
        if: ${{ !cancelled() && inputs.setup != true && inputs.probe != true && inputs.sheet != true }}
        id: write
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          # 켜라고 한 때만 보낸다. 예전엔 '끄라고 안 하면 보낸다' 였는데,
          # 크론 실행에는 입력이 비어 있어서 매주 조용히 텔레그램이 나갔다.
          # 이제 보고는 클로드의 마케팅 창으로 간다(월요일 10시 루틴).
          SEND=""
          [ "${{ inputs.send }}" = "true" ] && SEND="--send"
          python3 scripts/marketing_report.py $SEND | tee /tmp/report.md
          {
            echo "## 주간 성과 보고"
            echo ""
            cat /tmp/report.md
          } >> $GITHUB_STEP_SUMMARY

      # ③ 숫자를 구글 시트에 한 줄 붙인다 — 시간이 갈수록 한 눈에 보이게.
      #    ② 뒤에 두는 이유: 이번 주 보고가 올린 새 실험까지 실험 탭에 실린다.
      #    시크릿이 없으면 조용히 건너뛴다. 못 붙이면 이 단계만 빨갛게 남고
      #    보고는 그대로 나간다 — 조용히 넘어가서 한 주를 잃은 적이 있다(2026-09-14).
      - name: ③ 시트에 붙인다
        if: ${{ !cancelled() && inputs.setup != true && inputs.probe != true }}
        continue-on-error: true
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          MARKETING_SHEET_ID: ${{ secrets.MARKETING_SHEET_ID }}
        run: python3 scripts/marketing_sheet.py
