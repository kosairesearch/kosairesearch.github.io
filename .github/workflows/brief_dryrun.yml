name: 📰 모닝 브리핑 드라이런 (수동 · 커밋 없음)

# 브리핑이 쓸 사실을 실제로 모아 본다. 아무것도 커밋하지 않고 로그만 남긴다.
# 각 수집기를 따로 돌리므로, 하나가 죽어도 나머지 출력은 볼 수 있다.
on:
  workflow_dispatch:

jobs:
  dryrun:
    runs-on: ubuntu-latest
    # 상한이 없으면 한 단계가 매달릴 때 여섯 시간을 태운다. 브리핑은 07:30 에
    # 나가야 하므로, 늦게 나가는 것보다 실패하는 게 낫다 — 실패는 알림이
    # 오지만 늦음은 조용하다.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      # Actions 러너는 실행마다 새로 만들어진다. data/brief_cache 를
      # .gitignore 에 넣어 뒀으니 저장소로도 안 남는다 — 즉 캐시가 실행 사이에
      # 살아남지 않는다. 브리핑은 아침에 세 번 시도하는데 각각 다른 러너에서
      # 도니, 캐시를 여기서 실어 줘야 실제로 값을 한다.
      - name: 공시 목록 캐시 복원
        uses: actions/cache@v4
        with:
          path: data/brief_cache
          key: brief-cache-${{ github.run_id }}
          restore-keys: |
            brief-cache-

      - name: ⓞ 파서 회귀 테스트 (네트워크 불필요)
        if: always()
        run: python scripts/test_flows.py

      - name: ① 시세 · 개장 여부 (yfinance + holidays)
        if: always()
        timeout-minutes: 3
        run: python scripts/market_data.py

      - name: ② 투자자별 순매수 (네이버 · HTML/JSON 후보 6개)
        if: always()
        timeout-minutes: 3
        env:
          FLOWS_DUMP: '1'
        run: python scripts/flows.py

      - name: ③ 일정 (연준 + 수동 등록)
        if: always()
        timeout-minutes: 2
        run: python scripts/calendar_data.py --days 21

      - name: ④ 뉴스 (구글 뉴스 RSS)
        if: always()
        timeout-minutes: 4
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/news_data.py --tickers 005930,000660,005380

      - name: ⑤ 국내 사실 (우리 데이터 · 개장 여부 포함)
        if: always()
        timeout-minutes: 6
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/brief_data.py
