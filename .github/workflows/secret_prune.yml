name: 🔐 비밀값 옛 버전 정리 (수동)

# Secret Manager 는 켜짐 · 꺼짐 버전마다 달마다 돈을 받는다(결제 계정마다 6개 무료). 함수 배포가 같은 값으로 새 버전을 쌓아
# 2026-10-29 에 139개가 됐다(2026-11-05 사장 "firebase에서 과금되기 시작했는데 … 왜 그 요금이 나왔는지").
# 배포 작업이 끝날 때 같은 정리를 돌리므로 보통은 필요 없다 — 손으로 비밀값을 바꾼 뒤 · 의심될 때 돌린다.
# apply 를 끄면 계획(남길 버전 · 지울 개수)만 찍는다. 비밀값의 값은 읽지도 찍지도 않는다(scripts/secret_versions.py).
on:
  workflow_dispatch:
    inputs:
      apply:
        description: '켜면 지운다(끄면 계획만 찍는다)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 서비스 계정 인증
        env:
          SA: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$SA" > "$HOME/sa.json"
          gcloud auth activate-service-account --key-file="$HOME/sa.json" --quiet > /dev/null 2>&1

      - name: 옛 버전 정리
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          if [ "$APPLY" = "true" ]; then python3 scripts/secret_versions.py --apply; else python3 scripts/secret_versions.py; fi
