name: 📊 주식 데이터 자동 업데이트

on:
  schedule:
    # pykrx 종가는 장 마감(15:30) 직후가 아니라 '저녁'에 게시됨.
    # ⚠ GitHub 예약 실행은 혼잡 시간대에 수 시간(관측상 ~7.5h)씩 지연됨.
    #   실행 시각을 통제할 수 없으므로 하루에 걸쳐 분산 예약 —
    #   어느 크론이 얼마나 밀리든 저녁(19~24시 KST)에 최소 1회는 갱신되도록.
    #   일찍 도는 크론은 종가 미게시 시 무변경 종료(기존 가드)라 무해.
    - cron: '43 2 * * 1-5'   # 11:43 KST (지연 시 저녁 보강용)
    - cron: '13 4 * * 1-5'   # 13:13 KST
    - cron: '49 6 * * 1-5'   # 15:49 KST
    # --- 18:00 KST 이후: 오늘 종가를 잡을 수 있는 구간. 30분 간격으로 촘촘히. ---
    - cron: '7 9 * * 1-5'    # 18:07 KST (종가 확정 규칙 직후 첫 시도)
    - cron: '37 9 * * 1-5'   # 18:37 KST
    - cron: '13 10 * * 1-5'  # 19:13 KST (본래 목표 시각)
    - cron: '43 10 * * 1-5'  # 19:43 KST
    - cron: '13 11 * * 1-5'  # 20:13 KST
    - cron: '43 11 * * 1-5'  # 20:43 KST
    - cron: '13 12 * * 1-5'  # 21:13 KST
    - cron: '13 13 * * 1-5'  # 22:13 KST
    - cron: '43 13 * * 1-5'  # 22:43 KST
    - cron: '43 14 * * 1-5'  # 23:43 KST
    - cron: '13 15 * * 1-5'  # 00:13 KST(+1) 자정 백업
    - cron: '43 18 * * 1-5'  # 03:43 KST(+1) 새벽 백업(현재 실질 동작 시간대)
  workflow_dispatch:
    # 수동으로도 실행 가능 (GitHub 웹에서 버튼 클릭)
    inputs:
      full_universe:
        description: '전 상장사 수집(universe). 평소엔 no.'
        type: choice
        options: ['no', 'yes']
        default: 'no'
      universe_limit:
        description: 'universe 수집 상한(0=무제한, 디버그용)'
        type: string
        default: '0'

# 데이터 쓰기 워크플로 동시 실행 금지(커밋 레이스로 결과 유실 방지)
concurrency:
  group: kos-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DART_KEY_SET: ${{ secrets.DART_API_KEY != '' }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          FULL_UNIVERSE: ${{ inputs.full_universe == 'yes' && '1' || '' }}
          UNIVERSE_LIMIT: ${{ inputs.universe_limit || '0' }}
        run: |
          mkdir -p data
          echo "DART_KEY_SET=$DART_KEY_SET (len=${#DART_API_KEY})" > data/run.log
          echo "=== 스크립트 시작 $(date -u) ===" >> data/run.log
          python scripts/collect_data.py 2>&1 | tee -a data/run.log

      # 결과물만 보고 판정하는 독립 감시선. 수집기가 조용히 실패하거나 아예 안
      # 돌아도 여기서 드러난다. 낡으면 이 단계가 실패해 실행이 빨갛게 남는다.
      # (커밋 단계는 if: always() 라 정직한 상태 그대로 게시된다.)
      - name: 시세 신선도 점검
        if: always()
        run: |
          set -o pipefail
          python scripts/check_data_freshness.py 2>&1 | tee -a data/run.log

      # 종목 페이지(stock/{종목코드}.html · 영어 en/stock/{종목코드}.html) — 시세 · 지표가 들어 있어 매일 다시 만든다(바뀐 페이지만 쓴다). 리포트 글은
      # 리포트 상세 화면의 스크립트를 노드로 미리 돌려 넣는다(ubuntu 러너에 노드가 있다 · scripts/prerender_stock.mjs).
      # 옛 로봇용 사본(r/)은 새 주소로 보내는 껍데기가 되어 더는 만들지 않는다(2026-10-03).
      # 실패하면 이 실행이 빨갛게 남는다 — 데이터 커밋은 아래 단계가 if: always() 로 그대로 한다.
      - name: 종목 페이지 생성 (stock/*.html)
        if: always()
        run: python scripts/build_stock_static.py

      - name: sitemap 갱신
        if: always()
        run: python scripts/generate_sitemap.py || true

      - name: 변경사항 커밋 & 푸시
        if: always()
        run: |
          git config --global user.email "bot@kosairesearch.github.io"
          git config --global user.name "KOS ai Bot"
          git add -A data/ sitemap.xml stock/ en/
          git commit --allow-empty -m "📊 데이터 업데이트 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
          # 원격이 앞서간 경우(동시 커밋) rebase 후 재시도. 충돌 시 봇이 새로 만든
          # 데이터/사이트맵을 우선(-X theirs)해 자동 해결 — 충돌로 결과 유실 방지.
          ok=""
          for i in 1 2 3 4 5; do
            git fetch origin main || true
            if git rebase -X theirs origin/main && git push origin main; then ok=1; break; fi
            git rebase --abort 2>/dev/null || true
            echo "push 재시도 $i..."; sleep $((i*3))
          done
          if [ -z "$ok" ]; then echo "::error::push 최종 실패 — 결과 유실 방지를 위해 실패 처리"; exit 1; fi
