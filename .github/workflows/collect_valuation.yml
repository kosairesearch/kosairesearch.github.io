name: 전 종목 밸류에이션 수집 (이어받기)

on:
  workflow_dispatch:
    inputs:
      budget_min:
        description: '이번 실행 시간예산(분)'
        default: '50'
      force:
        description: '전부 재수집(분기 갱신 시 1)'
        default: ''
      tickers:
        description: '특정 종목만 즉시 재수집(쉼표 구분, 테스트용)'
        default: ''
  schedule:
    - cron: '17 */2 * * *'  # 2시간마다 — 한 번에 하나씩만(겹침 방지), 완료되면 즉시 종료

concurrency:
  group: kos-data
  cancel-in-progress: false

jobs:
  valuation:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 밸류에이션 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          BUDGET_MIN: ${{ inputs.budget_min || '50' }}
          FORCE: ${{ inputs.force }}
          VAL_TICKERS: ${{ inputs.tickers }}
        run: |
          python scripts/collect_valuation.py 2>&1 | tee data/valuation_run.log || true

      # 리포트는 만들 때의 주식수로 EPS·BPS 를 계산해 저장해 둔다. 그 뒤 회사가
      # 액면병합이나 감자를 하면 분모가 바뀌는데, 리포트를 다시 만들지 않는 한
      # 옛날 값이 그대로 걸려 있다. BPS 가 5배 작으면 PBR 은 5배 크게 나온다.
      # 리포트 생성이 멈춰 있는 동안에도 이 계산만은 매일 따라가게 둔다.
      - name: 주식수 바뀐 종목 EPS·BPS 환산
        run: |
          python scripts/patch_share_counts.py --apply 2>&1 | tee -a data/valuation_run.log || true

      - name: 결과 커밋
        run: |
          git config --global user.email "bot@kosairesearch.github.io"
          git config --global user.name "KOS ai Bot"
          # 이 잡이 내놓는 파일 전부를 담는다.
          #   valuation.js       ← collect_valuation.py · patch_share_counts.py
          #   reports_v2/·reports/ ← patch_share_counts.py 가 주식수 환산으로 고친 것
          # 예전에는 valuation.js 와 로그 둘만 담았다. 그러면 환산된 리포트가
          # 담기지 않은 채로 남아 rebase 가 "cannot rebase: You have unstaged
          # changes" 로 거부한다. 그 에러가 2>/dev/null 에 가려져 130회를 조용히
          # 실패했고, 주식수가 바뀐 37종목의 EPS·BPS 가 두 주 넘게 사이트에
          # 못 올라갔다(PBR 이 5~10배).
          for p in data/valuation.js data/reports_v2 data/reports; do
            [ -e "$p" ] && git add -A "$p"
          done
          # 실행 로그는 커밋하지 않는다. 매 실행이 통째로 다시 쓰는 파일이라
          # 실행이 겹치면 반드시 충돌하는데, 저장소에서 이 파일을 읽는 곳은
          # 없다(self-chain 은 작업공간의 것을 읽는다). generate_reports_v2·
          # collect_batch 도 같은 이유로 run.log 를 빼 둔다.
          git checkout -q -- data/valuation_run.log 2>/dev/null || true
          # index.json 은 여러 잡이 같이 다시 쓰는 전역 파일이라 담지 않는다
          # (generate_reports_v2·collect_batch 도 같은 이유로 뺀다). 이 잡이
          # 건드리지도 않지만, 담겼다가는 rebase 충돌을 부른다.
          git reset -q data/reports_v2/index.json 2>/dev/null || true
          git checkout -q -- data/reports_v2/index.json 2>/dev/null || true
          # 그래도 담기지 않은 변경이 남으면 rebase 가 또 거부한다. 이 잡이
          # 내보낼 것은 위 넷뿐이므로, 남은 것은 눈에 띄게 찍고 되돌린다.
          if ! git diff --quiet; then
            echo "::warning::이 잡의 결과물이 아닌 변경이 남아 되돌립니다:"
            git diff --name-only | sed 's/^/    /'
            git checkout -- .
          fi
          git commit -m "📊 밸류에이션 수집 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')" || exit 0
          # rebase·push 의 에러를 가리지 않는다. 가려 두면 왜 실패했는지 알 수 없다.
          ok=""
          for i in $(seq 1 25); do
            git fetch origin main -q || true
            if git rebase origin/main; then
              if git push origin main; then ok=1; break; fi
            elif [ "$(git diff --name-only --diff-filter=U)" = "data/valuation.js" ] \
                 && python3 scripts/merge_valuation.py; then
              # valuation.js 는 종목 2,700개짜리 JSON 을 매번 통째로 다시 쓰는
              # 파일이라, 실행이 둘 겹치면 텍스트로는 절대 안 합쳐진다. 결정적
              # 충돌이라 25번 재시도해도 25번 다 똑같이 실패한다(2026-09-12
              # 12:11 실행이 그렇게 죽었다). 내용은 종목별로 독립된 사전이므로
              # 종목 단위로 포개서 이어 간다.
              # 합치기가 실패하면 조건이 거짓이 되어 아래로 내려가 예전처럼
              # 물러난다 — 고치기 전보다 나빠지지 않는다.
              if git add data/valuation.js \
                 && GIT_EDITOR=true git rebase --continue \
                 && git push origin main; then ok=1; break; fi
            fi
            echo "  · ${i}번째 실패 — 되돌리고 다시 시도"
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 9) + 2 ))
          done
          [ -n "$ok" ] || { echo "::error::25번 모두 push 실패 — 위 에러 참고"; exit 1; }

      # 미완료(VALUATION_REMAINING)면 다음 청크를 스스로 재실행 → 불안정한 cron에 의존하지 않고
      # 전 종목 수집을 끝까지 진행. VALUATION_COMPLETE면 멈춤(cron이 주기적으로 다시 시작).
      - name: 미완료 시 self-chain
        if: ${{ always() && inputs.tickers == '' && inputs.force == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q "VALUATION_COMPLETE" data/valuation_run.log 2>/dev/null; then
            echo "→ 수집 완료. self-chain 중단."
          else
            echo "→ 미완료(남은 종목 있음). 다음 수집 청크 재실행."
            gh workflow run collect_valuation.yml -f budget_min=50
          fi

