name: 📊 마케팅 숫자 물어보기

# 클로드 앱을 컴퓨터에 깔지 않아도 숫자를 볼 수 있게 하는 문.
#
# 왜 있나
#   주간 보고는 월요일에 한 번 온다. 그 사이에 "네이버에서 온 사람 중
#   몇 명이 가입했지?" 가 궁금해지면 다음 주까지 기다려야 했다.
#   클로드(대화창)한테 물어보면 클로드가 이걸 대신 돌리고 읽어 준다.
#
# 답은 잠가서만 찍는다 (2026-10-06 사장 "외부에서 우리 마케팅 데이터를 보면 안되지")
#   이 저장소는 GitHub Pages 무료 요금제라 공개이고, 실행 기록(로그 · 요약 칸)도
#   GitHub 에 로그인한 누구나 본다. 전에는 답을 요약 칸에 그대로 찍어 방문자 수 ·
#   유입 경로 · 인기 종목이 밖에서 보였다.
#   이제 묻는 쪽(클로드 세션)이 만든 공개 열쇠(key)로 잠근 글만 찍고, 여는 열쇠는 묻는
#   쪽에만 있다 — scripts/marketing_seal.py · .claude/skills/마케팅/SKILL.md '숫자를 어떻게
#   가져오나'. key 가 없으면 묻지 않고 끝난다. 답을 그대로 찍는 길을 다시 만들지 마라.
#   사람이 Run workflow 를 눌러도 숫자는 보이지 않는다 — 클로드에게 물으면 된다.
#
# 돈 안 든다. 모델을 부르지 않고 이미 받아 둔 숫자를 꺼내 보기만 한다.

on:
  workflow_dispatch:
    inputs:
      tool:
        description: '무엇을 볼지'
        type: choice
        default: weekly
        options:
          - weekly       # 주간 숫자판 (텔레그램에 오는 그 표)
          - traffic      # 어디서 왔나 · 유입처별 가입 전환
          - pages        # 어느 페이지·어느 종목을 봤나
          - tickers      # 어느 종목 리포트를 봤나 — 종목별 조회수·몫 (처음부터)
          - behavior     # 얼마나 읽고 어디서 떠났나
          - trend        # 한 지표의 여러 주 흐름
          - report       # 지난 주간 보고서 원문
          - experiments  # 실험 대장
          - retention    # 첫 방문 뒤 1주 뒤·2주 뒤에 몇 명이 돌아왔나
          - check        # 기록이 잘 들어오나 (성과 아님 · 오늘 것도 보임)
          - day          # 하루가 이상할 때 — 그날을 쪼개 평소와 견준다 (봇·시험 가리기 · date=2026-10-04)
          - slice        # 한 갈래 안을 쪼갠다 (where=country:China by=eventName;hour+city)
          - weeks        # 받아 둔 주가 몇 개인지
      args:
        description: "더 볼 것 (예: week=2026-08-31 · metric=returnRate weeks=8)"
        default: ''
      key:
        description: '잠글 공개 열쇠 — scripts/marketing_seal.py newkey 가 찍은 한 줄 (없으면 묻지 않는다)'
        default: ''

permissions:
  contents: read

# 한 줄에 여러 개를 잇달아 물을 수 있어야 한다. concurrency 를 걸어
# 두었더니 두 번째를 물은 순간 첫 번째가 조용히 취소됐다(2026-09-13,
# run 34756654434). 읽기만 하는 일이라 동시에 돌아도 아무 문제 없다.

jobs:
  ask:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 열쇠부터 본다 — 열쇠 없이 물으면 답을 찍을 곳이 공개 기록뿐이다.
      - name: 열쇠 확인
        env:
          KEY: ${{ inputs.key }}
        run: |
          # 옛 설명서를 읽고 key 없이 물은 세션도 이 줄만 보고 따라올 수 있게, 할 일을 명령으로 적는다
          # (월요일 예약 작업은 그 대화창에서만 문구를 바꿀 수 있다 — 2026-10-06).
          if [ -z "$KEY" ]; then
            echo "::error title=열쇠 없음::key 가 비어 있어 묻지 않았다. 2026-10-06 부터 답은 잠겨서만 나온다(공개 기록). 1) git fetch -q origin main && git checkout origin/main -- scripts/marketing_seal.py .claude/skills/마케팅/SKILL.md  2) python3 scripts/marketing_seal.py newkey 가 찍은 한 줄을 inputs 의 key 로 넣어 다시 돌린다  3) python3 scripts/marketing_seal.py open --job <job id> 로 연다. 자세한 것은 SKILL.md '숫자를 어떻게 가져오나'"
            exit 1
          fi
          python3 scripts/marketing_seal.py check --key "$KEY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      # 고른 값은 env 로 넘긴다 — 쉘 명령줄에 그대로 붙이면 따옴표
      # 하나로 명령이 바뀐다. 답(오류 줄까지)은 파일로만 받고, 기록에는 잠근 줄만 찍는다.
      - name: 물어본다 (답은 잠가서만 찍는다)
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          TOOL: ${{ inputs.tool }}
          ARGS: ${{ inputs.args }}
          KEY: ${{ inputs.key }}
        run: |
          rc=0
          python3 scripts/marketing_mcp.py --ask "$TOOL" --args "$ARGS" > /tmp/answer.txt 2>&1 || rc=$?
          python3 scripts/marketing_seal.py seal --key "$KEY" --in /tmp/answer.txt
          echo "## $TOOL — 답은 잠겨 있습니다 (끝 코드 $rc)" >> "$GITHUB_STEP_SUMMARY"
          exit $rc
