name: ⏰ 브리핑 기상 릴레이

# 브리핑을 정확한 시각에 깨우는 일만 한다. 브리핑 자체는 만들지 않는다.
#
# ── 왜 이게 필요한가 ────────────────────────────────────────────────
#
# GitHub 의 schedule 은 "이 시각쯤" 이지 "이 시각" 이 아니다. 부하가 높으면
# 밀리고, 밀리는 폭이 예측되지 않으며, 아예 건너뛰기도 한다.
#
#   2026-08-27  06:00 슬롯이 09:23 에 발화 (+3시간 23분)
#               → 브리핑이 10:04 에 나갔다. 장 시작 한 시간 뒤다.
#
# 슬롯을 여러 개 두는 것으로는 못 막는다. 그날 세 슬롯이 전부 같은 폭으로
# 밀렸다 — 밀림은 슬롯별 사고가 아니라 스케줄러 전체의 상태다.
#
# ── 어떻게 푸는가 ──────────────────────────────────────────────────
#
# workflow_dispatch 는 밀리지 않는다. 큐를 거치지 않고 몇 초 안에 뜬다.
# 그래서 '언제 깨울지' 를 schedule 에서 떼어 낸다.
#
#   전날 밤 22:30 에 이 워크플로가 깨어난다  ← 여기는 밀려도 상관없다
#     └ 04:00 까지 잡 안에서 잠들어 있는다      (몇 시간 밀려도 04:00 은 04:00)
#         └ 04:00 에 morning_brief 를 직접 dispatch  ← 몇 초 안에 시작
#             └ 미국 마감까지 대기 → 생성 → 07:28 에 발행
#
# 밤 22:30 슬롯은 04:00 까지 5시간 30분의 여유가 있다. 오늘 같은 3시간 23분
# 지연은 물론이고 5시간이 밀려도 04:00 에 깨우는 데는 지장이 없다.
#
# 00:30 에 한 번 더 두어, 앞이 통째로 건너뛰어도 3시간 30분의 여유로 받는다.
#
# morning_brief 의 크론 슬롯 여섯 개는 그대로 둔다. 이 릴레이가 통째로
# 실패해도 그쪽이 받는다 — 두 경로가 서로를 모르고 독립적으로 동작한다.

on:
  schedule:
    # UTC. 일~목 = KST 월~금 아침의 전날 밤.
    - cron: '30 13 * * 0-4'    # KST 22:30 — 04:00 까지 5시간 30분 여유
    - cron: '30 15 * * 0-4'    # KST 00:30 — 예비. 3시간 30분 여유
  workflow_dispatch:

permissions:
  actions: write        # morning_brief 를 dispatch 하기 위해 필요하다
  contents: read

concurrency:
  # 두 슬롯이 겹쳐 깨어나도 잠든 놈을 죽이지 않는다. 뒤엣놈은 큐에서 기다리다
  # 앞이 깨우고 끝나면 실행되는데, 그때는 이미 발행됐거나 곧 발행되므로
  # morning_brief 쪽 멱등성(이미 있으면 건너뜀)이 알아서 처리한다.
  group: brief-relay
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    # 22:30 에 깨어나 04:00 까지 자면 5시간 30분이다. GitHub 잡 상한이 6시간
    # 이므로 그 안이지만 여유가 크지 않다 — 아래 대기 계산이 5시간 30분을
    # 넘기지 않도록 스스로 자른다.
    timeout-minutes: 350
    steps:
      - name: 04:00 KST 까지 대기했다가 브리핑을 깨운다
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 목표는 '다음에 오는 04:00 KST' 다.
          #
          # 여기서 한 번 틀렸다 잡았다. now.replace(hour=4) 로만 잡으면 밤
          # 22:30 에는 그날 04:00 — 이미 열여덟 시간 전이라 '지났다' 로 빠져
          # 그 자리에서 브리핑을 깨운다. 그러면 전날 밤에 하루 앞선 날짜로
          # 브리핑이 만들어진다. 날짜를 넘기는 처리가 있어야 한다.
          #
          # 깨어난 시각을 세 구간으로 나눈다.
          #   00:00~04:00  오늘 04:00 까지 기다린다
          #   04:00~08:00  이미 아침이다 — 기다리지 않고 바로 깨운다
          #   그 밖(낮·밤) 내일 04:00 이 목표. 다만 5시간 30분을 넘게 기다려야
          #                하면 잡 상한에 닿으므로 아무것도 하지 않는다 —
          #                그런 시각에 깨어나는 건 크론이 크게 어긋났다는 뜻이고,
          #                엉뚱한 때에 깨우느니 morning_brief 의 크론 슬롯에
          #                맡기는 편이 낫다.
          read -r ACTION SLEEP <<EOF
          $(python3 - <<'PY'
          import datetime
          from zoneinfo import ZoneInfo
          KST = ZoneInfo("Asia/Seoul")
          now = datetime.datetime.now(KST)
          four = now.replace(hour=4, minute=0, second=0, microsecond=0)
          CAP = 19800                      # 5시간 30분. 잡 상한 6시간 안쪽.
          if now < four:
              print("wait", int((four - now).total_seconds()))
          elif now < four + datetime.timedelta(hours=4):
              print("now", 0)              # 04:00~08:00 — 지금이 그 시각이다
          else:
              wait = int((four + datetime.timedelta(days=1) - now).total_seconds())
              if wait <= CAP:
                  print("wait", wait)
              else:
                  print("skip", 0)
          PY
          )
          EOF
          NOWK=$(TZ='Asia/Seoul' date +%H:%M)
          case "$ACTION" in
            skip)
              echo "지금은 $NOWK KST — 04:00 까지 5시간 30분을 넘게 남아 잡 상한에 닿는다."
              echo "깨우지 않는다. morning_brief 의 크론 슬롯이 받는다."
              exit 0 ;;
            wait)
              echo "04:00 KST 까지 ${SLEEP}초 대기 (지금 $NOWK KST)"
              sleep "$SLEEP" ;;
            now)
              echo "이미 아침이다 — 기다리지 않고 바로 깨운다 (지금 $NOWK KST)" ;;
            *)
              echo "::error::대기 시간을 계산하지 못했다 (ACTION=$ACTION)"; exit 1 ;;
          esac

          echo "▶ morning_brief 를 깨운다 ($(TZ='Asia/Seoul' date +%H:%M) KST)"
          # dispatch 는 큐를 거치지 않아 몇 초 안에 뜬다. 여기가 이 워크플로의
          # 존재 이유다 — schedule 이었다면 또 밀렸을 자리다.
          for i in 1 2 3 4 5; do
            gh workflow run morning_brief.yml && exit 0
            echo "재시도 $i"; sleep $((i * 10))
          done
          echo "::error::morning_brief dispatch 에 실패했다 — morning_brief 의 크론 슬롯이 받아야 한다"
          exit 1
