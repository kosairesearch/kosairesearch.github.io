name: 🗓️ 공시 트리거 리포트 (정기보고서 제출 종목 자동 갱신)

on:
  schedule:
    # 주말에도 돈다. 예전에는 평일(1-5)·화~토(2-6)만 걸려 있어서 일요일이 통째로
    # 비었고, 토요일 오전이 지나면 월요일 저녁까지 47시간을 쉬었다. 공시가 몰리는
    # 실적 시즌에는 그 이틀이 그대로 백로그로 쌓인다.
    #
    # 시각을 더 촘촘히 박지는 않는다. 이 워크플로는 collect_valuation(2시간마다)·
    # update_data 와 같은 kos-data 그룹을 쓰는데, cancel-in-progress:false 라
    # 대기 중인 run 은 뒤에 새 run 이 들어오면 취소된다. 촘촘할수록 서로 밀어낸다.
    - cron: '0 1 * * *'      # 10:00 KST — 전일 공시 반영
    - cron: '0 11 * * *'     # 20:00 KST — 당일 제출 공시 반영
    - cron: '30 21 * * *'    # 06:30 KST — 백로그 추가 소진 (update_data 가 비는 시간대)
  workflow_dispatch:

# 데이터 쓰기 워크플로 동시 실행 금지(커밋 레이스로 결과 유실 방지)
concurrency:
  group: kos-data
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: 최신 시세 갱신
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          mkdir -p data
          python scripts/collect_data.py 2>&1 | tee data/run.log || echo "(시세 갱신 실패 — 기존 데이터 사용)"

      - name: 신규 정기보고서 감지 (전 종목)
        id: filings
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          FILINGS_MAX_PER_RUN: ${{ vars.FILINGS_MAX_PER_RUN || '120' }}
          FILINGS_LOOKBACK_DAYS: ${{ vars.FILINGS_LOOKBACK_DAYS || '30' }}
        run: python scripts/check_filings.py

      - name: 신규 제출 종목 밸류에이션 즉시 갱신
        if: steps.filings.outputs.count != '0' && steps.filings.outputs.count != ''
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          VAL_TICKERS: ${{ steps.filings.outputs.new_tickers }}
        run: |
          # pykrx 는 한국거래소에 로그인할 때 아이디를 찍는다 — 저장소에 남는 기록에서는 가린다(2026-10-08).
          python scripts/collect_valuation.py 2>&1 | sed -u 's/\(로그인 ID: \).*/\1(가림)/' | tee data/valuation_run.log || true

      - name: 신규 제출 종목 리포트 생성 (v2 · batch · 상위300 Opus/나머지 Sonnet)
        id: v2
        if: steps.filings.outputs.count != '0' && steps.filings.outputs.count != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          REPORT_MODEL_TOP: 'claude-opus-5-5'
          REPORT_MODEL_REST: 'claude-sonnet-5-5'
          REPORT_MODEL_TOP_N: '300'
          REPORT_TICKERS: ${{ steps.filings.outputs.new_tickers }}
          # 정정 공시만 나온 종목 — 숫자를 새로 받아 저장된 리포트와 견주고, 같으면 다시 쓰지 않는다.
          REPORT_CORRECTIONS: ${{ steps.filings.outputs.corrections }}
          # 공시로 다시 쓰는 리포트는 늘 새로 받은 숫자로 쓴다. 저장된 숫자를 재사용하면 정정 · 이른 분기
          # 공시의 숫자가 빠진 채 다시 써진다(2026-10-07 정정 14개 중 13개가 그랬다).
          REPORT_NO_REUSE: '1'
          BATCH_MAX_WAIT_SEC: ${{ vars.BATCH_MAX_WAIT_SEC || '18000' }}
        run: |
          set -o pipefail
          echo "=== 공시 트리거 v2 생성 $(date -u) · 대상 ${{ steps.filings.outputs.new_tickers }} ===" > data/reports_v2_run.log
          # pykrx 는 한국거래소에 로그인할 때 아이디를 찍는다 — 저장소에 남는 기록에서는 가린다(2026-10-08).
          python scripts/generate_reports_v2.py auto 2>&1 | sed -u 's/\(로그인 ID: \).*/\1(가림)/' | tee -a data/reports_v2_run.log

      # 새 형식을 만들 수 없는 종목(공시 재무 조회에 연간 재무가 없다 — 코넥스 · 리츠 · 인프라펀드 · 외국 기업 · 사업보고서를
      # 아직 내지 않은 신규 상장)은 옛 형식 리포트를 그 공시로 다시 쓴다(2026-10-27 · 배치만 · Sonnet 5.5). 위 단계가 그 종목을
      # legacy 로 넘긴다(정정 공시만 나온 종목은 넘기지 않는다). 지난 옛 형식 배치를 받기 전에는 새로 주문하지 않고, 저장하지
      # 못한 횟수가 세 번인 종목은 뺀다(REPORT_SKIP_FAILED). 한 시간 안에 끝나지 않으면 다음 실행 · 신규 상장 작업이 받는다.
      - name: 새 형식을 만들 수 없는 종목 — 옛 형식 리포트 갱신 (batch · Sonnet 5.5)
        if: steps.v2.outputs.legacy != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          REPORT_MODEL: 'claude-sonnet-5-5'
          REPORT_TICKERS: ${{ steps.v2.outputs.legacy }}
          REPORT_SKIP_FAILED: '1'
          BATCH_MAX_WAIT_SEC: '3600'
        run: |
          set -o pipefail
          echo "=== 공시 트리거 옛 형식 갱신 $(date -u) · 대상 $REPORT_TICKERS ===" > data/reports_run.log
          python scripts/generate_reports_batch.py auto 2>&1 | tee -a data/reports_run.log

      - name: 커밋 & 푸시
        if: always()
        run: |
          git config --global user.email "bot@kosairesearch.github.io"
          git config --global user.name "KOS ai Bot"
          git add -A data/
          git commit --allow-empty -m "🗓️ 공시 트리거 리포트 $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M KST')"
          for i in 1 2 3 4 5; do
            git fetch origin main && git rebase -X theirs origin/main && git push origin main && break
            echo "push 재시도 $i..."; sleep $((i*3))
          done
