name: 🔎 클라우드 비용 조회 (읽기 전용 · 임시)

# 2026-11-05 사장 "firebase 에서 과금되기 시작했는데 얼마 나왔는지, 왜 그 요금이 나왔는지 알아보고".
# 결제 연결 · 사용 중인 API · 아티팩트 저장 용량 · 비밀값 버전 · 예약 작업 · 실행 서비스 설정 · 빌드 시간 ·
# 파이어스토어 읽기/쓰기 · 로그 용량 · 저장소 용량 · 단가표를 조회만 한다(아무것도 바꾸지 않는다).
# 실행 기록은 공개라 결과는 묻는 세션의 공개 열쇠로 잠가서만 찍는다(scripts/marketing_seal.py).
# 조회가 끝나면 이 파일은 지운다.
on:
  push:
    branches: [claude/festive-hawking-u4kth3]
    paths: ['.github/workflows/gcp_cost_probe.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 서비스 계정 인증
        env:
          SA: ${{ secrets.GCP_SA_KEY }}
        run: |
          printf '%s' "$SA" > "$HOME/sa.json"
          gcloud auth activate-service-account --key-file="$HOME/sa.json" --quiet > /dev/null 2>&1
          gcloud config set project kosai-ae167 --quiet > /dev/null 2>&1
          echo "인증 완료"

      - name: 조회 (결과는 잠가서만 찍는다)
        env:
          KEY: 
        run: |
          python3 scripts/marketing_seal.py check --key "$KEY"
          cat > /tmp/probe.py <<'PY'
          import atexit, collections, datetime as dt, json, re, shlex, subprocess, sys, traceback, urllib.error, urllib.parse, urllib.request
          P, R = "kosai-ae167", "asia-northeast3"
          out = []
          atexit.register(lambda: open("/tmp/out.txt", "w").write("\n".join(out)))
          sys.excepthook = lambda t, v, tb: out.append("[중단] " + "".join(traceback.format_exception(t, v, tb))[-1500:])
          def say(*a): out.append(" ".join(str(x) for x in a))
          def sh(cmd, timeout=240):
              try:
                  r = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=timeout)
                  return r.returncode, r.stdout, r.stderr.strip()[-1200:]
              except Exception as e:
                  return 1, "", f"[예외] {e}"
          def js(cmd):
              rc, o, e = sh(cmd)
              if rc != 0:
                  return None, e
              try:
                  return json.loads(o or "null"), ""
              except Exception as ex:
                  return None, f"[json] {ex} {o[:300]}"
          TOKEN = sh("gcloud auth print-access-token")[1].strip()
          def api(url, params=None, method="GET", body=None):
              if params:
                  url += "?" + urllib.parse.urlencode(params, doseq=True)
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method,
                                           headers={"Authorization": "Bearer " + TOKEN, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return json.loads(r.read() or b"null")
              except urllib.error.HTTPError as e:
                  return {"__error__": e.code, "body": e.read().decode("utf-8", "replace")[:600]}
              except Exception as e:
                  return {"__error__": str(e)}

          def section(t): say(""); say("## " + t)

          # 1) 계정 · 권한 · 결제 연결 · 사용 중인 API
          section("계정과 권한")
          acct = sh("gcloud config get-value account")[1].strip()
          say("계정:", acct)
          pol, err = js(f"gcloud projects get-iam-policy {P} --format=json")
          if pol:
              say("역할:", [b["role"] for b in pol.get("bindings", []) if f"serviceAccount:{acct}" in b.get("members", [])])
          else:
              say("역할 조회 실패:", err)
          section("결제 연결")
          rc, o, e = sh(f"gcloud billing projects describe {P} --format=json")
          say(o.strip() or e)
          section("사용 중인 API")
          rc, o, e = sh(f"gcloud services list --enabled --project {P} --format='value(config.name)'")
          say(" ".join(sorted(o.split())) if rc == 0 else e)

          section("파이어스토어 데이터베이스")
          rc, o, e = sh(f"gcloud firestore databases list --project {P} --format=json")
          say(o.strip()[:1500] or e)

          # 2) 함수 · 실행 서비스 · 예약 작업
          section("함수")
          fns, err = js(f"gcloud functions list --project {P} --format=json")
          if fns is None:
              say("실패:", err)
          else:
              for f in fns:
                  sc = f.get("serviceConfig") or {}
                  say(f.get("name", "").split("/")[-1], f.get("environment"), f.get("state"),
                      (f.get("name", "").split("/locations/")[-1].split("/")[0]),
                      "mem", sc.get("availableMemory") or f.get("availableMemoryMb"), "cpu", sc.get("availableCpu"),
                      "min", sc.get("minInstanceCount"), "max", sc.get("maxInstanceCount"),
                      "갱신", (f.get("updateTime") or "")[:10])
          section("실행 서비스(Cloud Run)")
          svcs, err = js(f"gcloud run services list --project {P} --platform managed --region {R} --format=json")
          if svcs is None:
              say("실패:", err)
          else:
              for s in svcs:
                  t = s["spec"]["template"]
                  ann = t.get("metadata", {}).get("annotations", {})
                  lim = (t["spec"]["containers"][0].get("resources") or {}).get("limits", {})
                  say(s["metadata"]["name"], "cpu", lim.get("cpu"), "mem", lim.get("memory"),
                      "minScale", ann.get("autoscaling.knative.dev/minScale"), "maxScale", ann.get("autoscaling.knative.dev/maxScale"),
                      "cpu-throttling", ann.get("run.googleapis.com/cpu-throttling"),
                      "conc", t["spec"].get("containerConcurrency"))
          section("예약 작업(Cloud Scheduler)")
          for loc in (R, "us-central1"):
              jobs, err = js(f"gcloud scheduler jobs list --project {P} --location {loc} --format=json")
              if jobs is None:
                  say(loc, "실패:", err[:300]); continue
              for j in jobs:
                  say(loc, j["name"].split("/")[-1], j.get("schedule"), j.get("timeZone"), j.get("state"), "생성", (j.get("userUpdateTime") or "")[:10])

          # 3) 비밀값(Secret Manager)
          section("비밀값")
          secs, err = js(f"gcloud secrets list --project {P} --format=json")
          if secs is None:
              say("실패:", err)
          else:
              tot = collections.Counter()
              for s in secs:
                  name = s["name"].split("/")[-1]
                  vers, err2 = js(f"gcloud secrets versions list {name} --project {P} --format=json")
                  if vers is None:
                      say(name, "버전 조회 실패", err2[:200]); continue
                  c = collections.Counter(v.get("state") for v in vers)
                  tot.update(c)
                  rep = "auto" if "automatic" in (s.get("replication") or {}) else json.dumps(s.get("replication"))[:80]
                  say(name, "생성", s.get("createTime", "")[:10], "복제", rep, "버전", dict(c),
                      "최근", sorted((v.get("createTime", "")[:10] for v in vers))[-3:])
              say("합계", dict(tot))

          # 4) 아티팩트 저장소
          section("아티팩트 저장소")
          for loc in (R, "us", "asia", "us-central1", "asia-northeast1", "europe"):
              repos, err = js(f"gcloud artifacts repositories list --project {P} --location {loc} --format=json")
              if repos is None:
                  say(loc, "실패:", err[:200]); continue
              for rp in repos:
                  rname = rp["name"].split("/")[-1]
                  say(loc, rname, rp.get("format"), "크기(바이트)", rp.get("sizeBytes"), "생성", (rp.get("createTime") or "")[:10],
                      "정리 정책", json.dumps(rp.get("cleanupPolicies") or {}, ensure_ascii=False)[:400],
                      "dry-run", rp.get("cleanupPolicyDryRun"))
                  if rp.get("format") == "DOCKER":
                      imgs, err3 = js(f"gcloud artifacts docker images list {loc}-docker.pkg.dev/{P}/{rname} --include-tags --format=json")
                      if imgs is None:
                          say("  이미지 조회 실패", err3[:200]); continue
                      months = collections.Counter((i.get("createTime") or "")[:7] for i in imgs)
                      say("  이미지", len(imgs), "· 크기 합(공유 층 중복 포함)", sum(int(i.get("metadata", {}).get("imageSizeBytes") or 0) for i in imgs),
                          "· 만든 달", dict(sorted(months.items())))

          # 5) 빌드
          section("빌드(Cloud Build)")
          for loc in (R, "global"):
              blds, err = js(f"gcloud builds list --project {P} --region {loc} --limit 2000 --format=json")
              if blds is None:
                  say(loc, "실패:", err[:200]); continue
              agg = collections.defaultdict(lambda: [0, 0.0, collections.Counter(), collections.Counter()])
              for b in blds:
                  m = (b.get("createTime") or "")[:7]
                  a = agg[m]; a[0] += 1
                  try:
                      s0 = dt.datetime.fromisoformat(b["startTime"].replace("Z", "+00:00"))
                      s1 = dt.datetime.fromisoformat(b["finishTime"].replace("Z", "+00:00"))
                      a[1] += (s1 - s0).total_seconds() / 60
                  except Exception:
                      pass
                  a[2][b.get("status")] += 1
                  a[3][(b.get("options") or {}).get("machineType") or (b.get("options") or {}).get("pool", {}).get("name", "기본")] += 1
              for m in sorted(agg):
                  a = agg[m]
                  say(loc, m, "빌드", a[0], "· 분", round(a[1], 1), "· 상태", dict(a[2]), "· 기계", dict(a[3]))

          # 6) 저장소(Cloud Storage)
          section("저장소(Cloud Storage)")
          rc, o, e = sh(f"gcloud storage buckets list --project {P} --format='value(name,location,storageClass)'")
          if rc != 0:
              say("실패:", e)
          for line in o.splitlines():
              b = line.split()[0]
              rc2, o2, e2 = sh(f"gcloud storage du -s gs://{b}", timeout=300)
              say(line, "·", (o2.strip() or e2)[:120])

          # 7) 감시 지표(최근 약 6주 — 지표 보관 기간)
          end = dt.datetime.now(dt.timezone.utc).replace(minute=0, second=0, microsecond=0)
          start = end - dt.timedelta(days=42)
          def ts(metric, extra="", group=(), period=86400, aligner="ALIGN_SUM", reducer="REDUCE_SUM"):
              params = {"filter": f'metric.type="{metric}"' + extra,
                        "interval.startTime": start.isoformat().replace("+00:00", "Z"),
                        "interval.endTime": end.isoformat().replace("+00:00", "Z"),
                        "aggregation.alignmentPeriod": f"{period}s",
                        "aggregation.perSeriesAligner": aligner,
                        "aggregation.crossSeriesReducer": reducer}
              if group:
                  params["aggregation.groupByFields"] = list(group)
              res, page = [], None
              while True:
                  if page:
                      params["pageToken"] = page
                  r = api(f"https://monitoring.googleapis.com/v3/projects/{P}/timeSeries", params)
                  if "__error__" in r:
                      return r
                  res += r.get("timeSeries", [])
                  page = r.get("nextPageToken")
                  if not page:
                      return res
          def val(p):
              v = p["value"]
              return float(v.get("int64Value") or v.get("doubleValue") or 0)
          def daily(metric, extra="", label=None):
              section(f"지표 {metric}{extra}")
              r = ts(metric, extra)
              if isinstance(r, dict):
                  say("실패:", r); return
              per = collections.Counter()
              for s in r:
                  for p in s.get("points", []):
                      per[p["interval"]["endTime"][:10]] += val(p)
              months = collections.Counter()
              for d, v in per.items():
                  months[d[:7]] += v
              say("월 합계", {k: round(v) for k, v in sorted(months.items())})
              say("하루 최대", max(per.values()) if per else 0, "· 하루 값", {k: round(v) for k, v in sorted(per.items())})
          def by_group(metric, field, extra="", period=86400, aligner="ALIGN_SUM", reducer="REDUCE_SUM", gauge=False):
              section(f"지표 {metric}{extra} — {field} 별 월 합계")
              r = ts(metric, extra, group=(field,), period=period, aligner=aligner, reducer=reducer)
              if isinstance(r, dict):
                  say("실패:", r); return
              key = field.split(".")[-1]
              for s in r:
                  lab = (s.get("resource", {}).get("labels", {}) | s.get("metric", {}).get("labels", {})).get(key)
                  months = collections.Counter()
                  for p in s.get("points", []):
                      m = p["interval"]["endTime"][:7]
                      months[m] = max(months[m], val(p)) if gauge else months[m] + val(p)
                  say(lab, {k: round(v, 1) for k, v in sorted(months.items())})
          daily("firestore.googleapis.com/document/read_count")
          daily("firestore.googleapis.com/document/write_count")
          daily("firestore.googleapis.com/document/delete_count")
          by_group("run.googleapis.com/request_count", "resource.labels.service_name")
          by_group("run.googleapis.com/container/cpu/allocation_time", "resource.labels.service_name")
          by_group("run.googleapis.com/container/memory/allocation_time", "resource.labels.service_name")
          by_group("run.googleapis.com/container/billable_instance_time", "resource.labels.service_name")
          by_group("run.googleapis.com/container/network/sent_bytes_count", "resource.labels.service_name")
          by_group("logging.googleapis.com/billing/bytes_ingested", "resource.labels.project_id")
          by_group("serviceruntime.googleapis.com/api/request_count", "resource.labels.method",
                   ' AND resource.labels.service="secretmanager.googleapis.com"')
          by_group("artifactregistry.googleapis.com/repository/size", "resource.labels.repository_id",
                   period=86400, aligner="ALIGN_MAX", reducer="REDUCE_MAX", gauge=True)
          by_group("storage.googleapis.com/storage/total_bytes", "resource.labels.bucket_name",
                   period=86400, aligner="ALIGN_MAX", reducer="REDUCE_MAX", gauge=True)

          # 8) 인증 종류(Identity Platform 으로 올렸는지)
          section("인증 설정")
          r = api(f"https://identitytoolkit.googleapis.com/admin/v2/projects/{P}/config")
          say({k: r.get(k) for k in ("subtype", "__error__")} if isinstance(r, dict) else r)

          # 9) 결제 내역 내보내기(BigQuery)가 있으면 실제 청구액
          section("BigQuery 결제 내보내기")
          ds, err = js(f"bq ls --format=json --project_id={P}")
          if ds is None:
              say("실패:", err[:300])
          else:
              say("데이터셋", [d.get("datasetReference", {}).get("datasetId") for d in (ds or [])])
              for d in ds or []:
                  did = d["datasetReference"]["datasetId"]
                  tb, err2 = js(f"bq ls --format=json {P}:{did}")
                  for t in tb or []:
                      tid = t["tableReference"]["tableId"]
                      if tid.startswith("gcp_billing_export"):
                          q = (f"SELECT invoice.month AS m, service.description AS svc, sku.description AS sku, "
                               f"ROUND(SUM(cost),2) AS cost, ROUND(SUM(IFNULL((SELECT SUM(c.amount) FROM UNNEST(credits) c),0)),2) AS credits, currency "
                               f"FROM `{P}.{did}.{tid}` GROUP BY 1,2,3,6 HAVING ABS(cost) > 0 ORDER BY 1,4 DESC")
                          rc, o, e = sh("bq query --nouse_legacy_sql --format=prettyjson --max_rows=500 " + shlex.quote(q))
                          say(tid, o[:20000] if rc == 0 else e)

          # 10) 단가표(원화 · 서울 · 전 세계 SKU 만)
          section("단가표")
          want = {"Artifact Registry", "Secret Manager", "Cloud Scheduler", "Cloud Run", "Cloud Build", "Cloud Firestore",
                  "Cloud Storage", "Cloud Logging", "Cloud Run Functions", "Cloud Functions", "Networking", "Cloud Monitoring",
                  "Identity Platform", "Artifact Analysis", "Container Scanning", "Container Analysis"}
          svcs_all, page = [], None
          while True:
              r = api("https://cloudbilling.googleapis.com/v1/services", {"pageSize": 5000, **({"pageToken": page} if page else {})})
              if "__error__" in r:
                  say("서비스 목록 실패:", r); break
              svcs_all += r.get("services", [])
              page = r.get("nextPageToken")
              if not page:
                  break
          for s in svcs_all:
              if s.get("displayName") not in want:
                  continue
              sid = s["serviceId"]
              skus, page = [], None
              while True:
                  r = api(f"https://cloudbilling.googleapis.com/v1/services/{sid}/skus",
                          {"currencyCode": "KRW", "pageSize": 5000, **({"pageToken": page} if page else {})})
                  if "__error__" in r:
                      say(s["displayName"], "SKU 실패", r); break
                  skus += r.get("skus", [])
                  page = r.get("nextPageToken")
                  if not page:
                      break
              for k in skus:
                  regs = k.get("serviceRegions", [])
                  if not ({R, "global", "asia", "asia-northeast3"} & set(regs)) and regs:
                      continue
                  for pi in k.get("pricingInfo", [])[:1]:
                      pe = pi.get("pricingExpression", {})
                      tiers = [(t.get("startUsageAmount"), round(int(t["unitPrice"].get("units") or 0) + t["unitPrice"].get("nanos", 0) / 1e9, 6))
                               for t in pe.get("tieredRates", [])]
                      say(s["displayName"], "|", k.get("description"), "|", ",".join(regs)[:40], "|", pe.get("usageUnitDescription"), "|", tiers)

          open("/tmp/out.txt", "w").write("\n".join(out))
          PY
          python3 /tmp/probe.py > /dev/null 2>&1 || echo "조회 스크립트가 중간에 멈췄습니다(잠근 결과에 남은 만큼만)"
          [ -s /tmp/out.txt ] || echo "결과 없음" > /tmp/out.txt
          python3 scripts/marketing_seal.py seal --key "$KEY" --in /tmp/out.txt
