<script>
/* 활성 표시선 — 컨테이너마다 선 하나를 두고, 활성 항목(.on)의 자리로 미끄러뜨린다.
   axis 'x' = 밑줄, 'y' = 왼쪽 세로선. sel 로 활성 항목 선택자를 바꿀 수 있다(기본 .on).
   첫 자리는 그냥 놓고, 그 뒤부터 element.animate() 로 이전 자리에서 새 자리로 움직인다.
   CSS transition 을 안 쓰는 이유: 휴대폰 목차 띠가 헤더 안으로 옮겨 붙는 프레임에 항목이 같이 바뀌면
   방금 옮겨진 요소라 transition 이 시작되지 않는다. animate() 는 DOM 이동과 무관하게 움직인다.
   window.kosIndMs 로 길이를 바꿀 수 있다(시험용). 움직임 줄이기 설정이면 바로 놓는다. */
window.kosInd=function(box,axis,sel){
  if(!box)return function(){};
  if(box.__ind)return box.__ind;
  var ind=document.createElement('span');ind.className='ind '+(axis==='y'?'ind-v':'ind-h');ind.setAttribute('aria-hidden','true');box.appendChild(ind);
  var last=null,placed=false,anim=null,rm=window.matchMedia?matchMedia('(prefers-reduced-motion:reduce)'):null;
  function move(force){
    var a=box.querySelector(sel||'.on');
    if(!a){ind.style.opacity='0';last=null;return}
    if(a===last&&!force)return;
    var b=box.getBoundingClientRect(),r=a.getBoundingClientRect();
    if(!r.width&&!r.height)return;
    last=a;
    var x=r.left-b.left-box.clientLeft+box.scrollLeft,y=r.top-b.top-box.clientTop+box.scrollTop;
    var to={transform:'translate('+x+'px,'+(axis==='y'?y:y+r.height-2)+'px)'};
    if(axis==='y')to.height=r.height+'px';else to.width=r.width+'px';
    var from=null;
    if(placed&&ind.animate&&!(rm&&rm.matches)){var cs=getComputedStyle(ind);from={transform:cs.transform};if(axis==='y')from.height=cs.height;else from.width=cs.width;if(anim){anim.cancel();anim=null}}
    ind.style.opacity='';ind.style.transform=to.transform;if(axis==='y')ind.style.height=to.height;else ind.style.width=to.width;
    if(from){anim=ind.animate([from,to],{duration:window.kosIndMs||300,easing:'cubic-bezier(.2,.8,.2,1)'});anim.onfinish=function(){anim=null}}
    placed=true;
  }
  addEventListener('resize',function(){move(true)});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){move(true)});
  box.__ind=move;move();return move;
};

<style>

/* 가격 방향 색 — 한국어는 오르면 빨강 · 내리면 파랑, 영어는 해외 관례대로 오르면 초록 · 내리면 빨강(실사이트 영어판과 같은 방향).
   --up 은 오류 · 경고 글자에도 쓰므로 그대로 두고, 가격 방향(.up · .down · 강세/약세 점)만 이 둘을 쓴다.
   초록은 빨강과 밝기를 맞췄다 — 바탕에 대한 명암비 라이트 5.4:1 · 다크 6.5:1(빨강 5.5:1 · 6.2:1). */
:root{--rise:var(--up);--fall:var(--down)}

@view-transition{navigation:auto}
.nav{view-transition-name:kos-nav}
/* 옛 모듈(auth-state · settings-panel · auth-guard · consent · checkout)이 쓰는 토큰 이름 — 새 토큰에 잇는다. 모듈을 새 이름으로 고칠 때까지의 다리 */
:root{--font-sans:var(--font);--fg-1:var(--ink);--fg-2:var(--ink-72);--fg-3:var(--ink-62);--bg-1:var(--surface);--border-2:var(--line);--shadow-2:0 8px 24px rgba(20,20,20,.08);--brand-blue:var(--ink);--brand-cyan:var(--ink-72);--radius-sm:8px;--radius-md:12px;--radius-lg:16px}

body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums lining-nums;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit;text-decoration:none}

/* 휴대폰 메뉴 — ☰ 를 누르면 헤더 아래를 페이지색 한 장이 다 덮는다. 큰 글자 다섯 · 계정 · 맨 아래 작은 링크.
   (9/26 사장: 헤더에서 내려오던 목록이 안 예쁘다 — 그건 기능만 있던 자리였다.) nav 바깥에 둔다: .nav.scrolled 의

@media (max-width:820px){.mmenu.open{display:flex;animation:mmIn .18s ease-out}} @keyframes mmIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}} @media (prefers-reduced-motion:reduce){.mmenu.open{animation:none}}

/* 계정(로그인 상태) — 이메일 첫 글자 동그라미와 작은 메뉴. 시안은 ?user=이메일 로 켠다 */

.acct-menu{display:none;position:absolute;right:0;top:calc(100% + 10px);min-width:220px;background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:6px 0;box-shadow:0 8px 24px rgba(20,20,20,.08);z-index:60}
.acct.open .acct-menu{display:block} .acct-menu .em{padding:8px 16px 10px;font:400 12px/16px var(--font);color:var(--ink-62);border-bottom:1px solid var(--hair);margin-bottom:4px;word-break:break-all}
.acct-menu a,.acct-menu button{display:block;width:100%;box-sizing:border-box;text-align:left;border:0;background:none;padding:9px 16px;font:500 14px/20px var(--font);color:var(--ink-72);cursor:pointer;text-decoration:none} .acct-menu a:hover,.acct-menu button:hover{background:var(--surface-2);color:var(--ink)}
/* 단추 */
/* 활성 표시선(kosInd) — 목차 세로선·밑줄 탭·쪽 번호가 쓴다. 움직임은 IND_JS 의 animate() */
.ind{position:absolute;left:0;top:0;background:var(--ink);pointer-events:none;will-change:transform} .ind-v{width:2px} .ind-h{height:2px}

/* 키보드 포커스 — 먹색 2px 윤곽을 2px 띄워 두른다(브라우저 기본 고리는 파랑·이중선이라 옷과 따로 논다). 마우스로 누를 땐 안 나온다(:focus-visible).
   가로로 넘기는 띠(.chips·.tabs·.seg·.sorts·설정 탭·표 틀) 안에서는 윤곽이 잘리므로 안쪽에 그린다. 밑줄 입력칸·검색창은 원래 밑줄이 먹색으로 바뀌는데, 거기에 1px 을 더해 2px 로 굵게 한다. */

function fld(id, label, placeholder){
  const f = el('div', 'fld');
  const l = el('label', null, label); l.htmlFor = id;
  const i = el('input'); i.id = id; i.type = 'password'; i.autocomplete = 'new-password'; i.placeholder = placeholder; i.required = true;
  f.appendChild(l); f.appendChild(i); f.appendChild(el('div', 'msg'));
  return f;
}
function fm(input, msg){ const f = input.closest('.fld'); f.querySelector('.msg').textContent = msg; f.classList.add('err'); }
function paint(crumb, title, desc){
  crumbEl.textContent = crumb; titleEl.textContent = title; descEl.textContent = desc;
  bodyEl.textContent = '';
}

/* 현재 화면 상태 — 상태를 바꾸고 render() 로 다시 그린다. */
let state = { kind: 'loading' };

function render(){
  const s = state;
  if(s.kind === 'loading'){
    paint('계정 인증', '처리 중…', '잠시만 기다려 주시기 바랍니다.');
    const spin = el('div', 'spin'); spin.setAttribute('aria-label', '로딩');
    bodyEl.appendChild(spin);
  } else if(s.kind === 'ok'){
    paint(s.crumb, s.title, s.desc);
    bodyEl.appendChild(goBtn('로그인하러 가기', s.href));
  } else if(s.kind === 'error'){
    paint(s.crumb || '계정 인증', s.title, s.desc);
    bodyEl.appendChild(goBtn('로그인하러 가기', 'Login.html'));   // 같은 곳으로 가는 단추는 같은 이름(2026-10-03)
  } else if(s.kind === 'reset'){
    // 이메일이 문장 안에 들어가 사전으로는 못 바꾼다 — 영어 화면(i18n.js)은 여기서 바로
    const en = !!(window.KOSi18n && window.KOSi18n.lang === 'en');
    paint('비밀번호 재설정', '새 비밀번호 설정', en ? 'Enter a new password for ' + s.email + '.' : s.email + ' 계정의 새 비밀번호를 입력하여 주시기 바랍니다.');
    const form = el('form'); form.id = 'rs'; form.noValidate = true;
    form.appendChild(fld('np', '새 비밀번호', '영문·숫자 포함 8자 이상'));
    form.appendChild(fld('np2', '새 비밀번호 확인', '비밀번호를 다시 입력하십시오'));
    const btn = el('button', 'btn btn-ink', '비밀번호 변경'); btn.type = 'submit'; btn.id = 'rsSubmit';
    form.appendChild(btn);
    bodyEl.appendChild(form);
    form.querySelectorAll('input').forEach(i => i.addEventListener('input', () => i.closest('.fld').classList.remove('err')));
    form.addEventListener('submit', onResetSubmit);
  }
}

async function onResetSubmit(ev){
  ev.preventDefault(); clearErr();
  const np = $('#np'), np2 = $('#np2');
  [np, np2].forEach(i => i.closest('.fld').classList.remove('err'));
  const pw = np.value, pw2 = np2.value;
  if(!pw) fm(np, '비밀번호를 입력하여 주시기 바랍니다.');
  else if(pw.length < 8 || !/[A-Za-z]/.test(pw) || !/[0-9]/.test(pw)) fm(np, '비밀번호는 영문과 숫자를 포함해 8자 이상이어야 합니다.');
  if(!pw2) fm(np2, '비밀번호를 다시 입력하여 주시기 바랍니다.');
  else if(pw !== pw2) fm(np2, '비밀번호가 일치하지 않습니다.');
  const bad = [np, np2].find(i => i.closest('.fld').classList.contains('err'));
  if(bad){ bad.focus(); return; }
  const btn = $('#rsSubmit'); btn.disabled = true;
  try{
    await confirmPasswordReset(auth, oobCode, pw);
    state = { kind: 'ok', crumb: '비밀번호 재설정', title: '비밀번호가 변경되었습니다', desc: '새 비밀번호로 로그인하여 주시기 바랍니다.', href: 'Login.html' };
    render();
  }catch(e){
    btn.disabled = false;
    const c = (e && e.code) || '';
    if(c.includes('expired') || c.includes('invalid-action-code')) showErrMsg('링크가 만료되었거나 이미 사용되었습니다. 메일을 다시 요청하여 주시기 바랍니다.');
    else showErrMsg('비밀번호 변경에 실패했습니다. 잠시 후 다시 시도하여 주시기 바랍니다.');
  }
}

async function run(){
  if(!mode || !oobCode){
    state = { kind: 'error', title: '잘못된 접근입니다', desc: '유효하지 않은 링크입니다. 메일의 버튼을 다시 눌러 주시기 바랍니다.' };
    render(); return;
  }
  try{
    if(mode === 'verifyEmail'){
      await applyActionCode(auth, oobCode);
      state = { kind: 'ok', crumb: '이메일 인증', title: '이메일 인증이 완료되었습니다', desc: 'KOSAI의 모든 기능을 이용하실 수 있습니다. 로그인하여 주시기 바랍니다.', href: continueUrl };
    } else if(mode === 'resetPassword'){
      const email = await verifyPasswordResetCode(auth, oobCode);
      state = { kind: 'reset', email };
    } else if(mode === 'recoverEmail' || mode === 'verifyAndChangeEmail'){
      await applyActionCode(auth, oobCode);
      state = { kind: 'ok', crumb: '이메일 변경', title: '이메일 주소가 변경되었습니다', desc: '변경된 이메일로 다시 로그인하여 주시기 바랍니다.', href: continueUrl };
    } else {
      state = { kind: 'error', title: '지원하지 않는 요청', desc: '유효하지 않은 링크입니다.' };
    }
  }catch(e){
    const c = (e && e.code) || '';
    if(c.includes('expired')) state = { kind: 'error', title: '링크가 만료되었습니다', desc: '보안을 위해 인증 링크는 일정 시간이 지나면 만료됩니다. 메일을 다시 요청하여 주시기 바랍니다.' };
    else if(c.includes('invalid-action-code')) state = { kind: 'error', title: '이미 사용된 링크입니다', desc: '이미 처리되었거나 유효하지 않은 링크입니다. 새로 요청하여 주시기 바랍니다.' };
    else state = { kind: 'error', title: '처리 중 문제가 발생했습니다', desc: '잠시 후 다시 시도하시거나, 메일을 다시 요청하여 주시기 바랍니다.' };
  }
  render();
}

render();
run();

</script>
