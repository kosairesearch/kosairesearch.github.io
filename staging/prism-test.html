<h1>블렌더랑 맞추기 &mdash; 어느 번호가 제일 가까워?</h1>
<p class="lead">모양은 블렌더에서 좌표를 그대로 뽑아온 것이라 넷 다 같다. 다른 것은 <b>빛</b>이다.
블렌더는 거의 새까만 방에 조명 셋인데, 지금 올라가 있는 웹 화면은 사방에 밝은 패널 일곱이 둘러싸고 있어서
프리즘만 혼자 하얗게 떴다. 아래 1번이 그 상태고, 2~4번은 블렌더 조명을 옮겨온 것이다. 끌면 돌아간다.</p>

<div class="ref"><img src="prism-blender.jpg" alt="블렌더 렌더">
<b>&#9650; 목표 &mdash; 블렌더에서 뽑은 실제 렌더</b></div>
