<h1>유리 너머로 뒷면이 보이나 &mdash; 어느 번호?</h1>
<p class="lead">three.js 는 유리 뒤 화면에 <b>불투명한 물체만</b> 그려 넣는다. 프리즘 자신은 투과 재질이라
그 목록에서 빠져서, 그냥 두면 유리 너머로 제 뒷면이 보이지 않는다(= 1번). 같은 메시의 안쪽 면을
불투명으로 한 번 더 그려 넣으면 보인다. 그 밝기만 다르게 한 넷이다. 끌어서 돌려 봐.</p>

function build(v){
  const tile=document.createElement('div');tile.className='tile';
  tile.innerHTML='<h2><b>'+v.n+'</b>'+v.label+'<span>'+v.sub+'</span></h2>';
  const cv=document.createElement('canvas');tile.appendChild(cv);
  document.getElementById('g').appendChild(tile);
  const r=new THREE.WebGLRenderer({canvas:cv,antialias:true});
  r.setClearColor('#04060f',1);r.toneMapping=THREE.ACESFilmicToneMapping;
  r.toneMappingExposure=1.22;r.outputColorSpace=THREE.SRGBColorSpace;
  r.setPixelRatio(Math.min(devicePixelRatio,2));

  {const env=new THREE.Scene();
   const box=function(w,h,c,i,x,y,z,ry,rx){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
     new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(i),side:THREE.DoubleSide}));
     m.position.set(x,y,z);m.rotation.set(rx||0,ry||0,0);env.add(m);};
   box(20,10,'#ffffff',11,0,9,1,Math.PI/2); box(4,12,'#bcd2ff',5,-10,0,2,Math.PI/2.3);

  const key=new THREE.DirectionalLight(0xffffff,2.0);key.position.set(4,6,7);sc.add(key);
  /* 불투명 배경판 — 유리 너머로 보이는 유일한 배경 */
  const bg=new THREE.Mesh(new THREE.PlaneGeometry(90,90),new THREE.MeshBasicMaterial({color:0x0a1226}));
  bg.position.z=-30;sc.add(bg);
  /* 별 — 불투명이라야 유리 너머로 비친다 */
  const dp=[];for(let i=0;i<260;i++)dp.push((Math.random()-.5)*22,(Math.random()-.5)*14,(Math.random()-.5)*16-4);

  const p=new Float32Array(PRISM_TRIS.length);

    envMapIntensity:2.0,specularIntensity:1}));
  if(v.inner!==null){
    const inner=new THREE.Mesh(geo,new THREE.MeshPhysicalMaterial({
      color:0xdfe9ff,metalness:0,roughness:0.06,flatShading:true,
      side:THREE.BackSide,envMapIntensity:v.inner,clearcoat:1,clearcoatRoughness:0.04}));
    inner.scale.setScalar(0.998);prism.add(inner);
  }
  const group=new THREE.Group();group.add(prism);sc.add(group);
  let ox=0.34,oy=0.72,drag=false,lx=0,ly=0;
  cv.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
  cv.addEventListener('pointermove',function(e){if(!drag)return;oy+=(e.clientX-lx)*0.0065;ox+=(e.clientY-ly)*0.005;lx=e.clientX;ly=e.clientY;});
  const st=function(){drag=false;};cv.addEventListener('pointerup',st);cv.addEventListener('pointercancel',st);
  function size(){const w=cv.clientWidth,h=cv.clientHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
  size();addEventListener('resize',size);
  r.setAnimationLoop(function(){const t=performance.now()/1000;
    group.rotation.y=oy+t*0.16;group.rotation.x=ox+Math.sin(t*0.23)*0.17;r.render(sc,cam);});
